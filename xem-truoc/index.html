<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Language Explorers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="canopy.css">
<link rel="stylesheet" href="ls.css">
<link rel="stylesheet" href="bo-sung.css">
<link rel="stylesheet" href="bo-cuc.css">
<link rel="stylesheet" href="qua.css">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
  --red:#E3262E; --red-dark:#B8141C; --yellow:#FFC72C; --yellow-soft:#FFF4CC;
  --cream:#FFFBF0; --ink:#3A2A1A; --muted:#7A6A58; --white:#fff;
  --green:#3BB273; --teal:#1FA5A0; --sky:#4AA3E8; --line:#F0E2C0;
  --seed:#3BB273; --seedling:#1FA5A0; --canopy:#E3262E;
  --shadow:0 6px 0 rgba(58,42,26,.12);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Baloo 2','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:var(--cream);color:var(--ink);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei','Heiti SC',sans-serif}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 48px}

/* header */
.top{background:var(--red);color:var(--white);padding:10px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;box-shadow:0 3px 0 var(--red-dark)}
.top-in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;text-decoration:none;color:#fff}
.logo-badge{width:36px;height:36px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-size:20px}
.top .sp{flex:1}
.back{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:16px}
.star-count{white-space:nowrap;flex:none;background:var(--yellow);color:var(--ink);border-radius:999px;padding:4px 12px;font-weight:800;font-size:16px}

/* hero */
.hero{background:linear-gradient(180deg,var(--red) 0%,#F04A3F 100%);color:#fff;text-align:center;padding:28px 16px 70px;position:relative;overflow:hidden}
.hero h1{margin:6px 0 2px;font-size:clamp(28px,6vw,44px);line-height:1.05}
.hero .tag{display:inline-block;background:var(--yellow);color:var(--ink);font-weight:800;border-radius:999px;padding:4px 16px;margin-top:8px}
.hero p{margin:10px auto 0;max-width:560px;opacity:.95}
.hero .float{position:absolute;font-size:34px;animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media (max-width:560px){.hero{padding-top:44px}.hero .float{font-size:22px;opacity:.55}.hero .float:nth-of-type(3),.hero .float:nth-of-type(4){display:none}}
.wave{position:absolute;bottom:-1px;left:0;width:100%;height:50px}

/* group choice */
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:-40px;position:relative;z-index:2}
.gcard{background:#fff;border-radius:24px;padding:20px;box-shadow:var(--shadow);border:3px solid var(--line);text-align:left;color:var(--ink);transition:transform .15s}
.gcard:hover{transform:translateY(-4px)}
.gcard .ico{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:36px;margin-bottom:8px}
.gcard h3{margin:0;font-size:24px}
.gcard .age{font-weight:700;color:var(--muted);font-size:15px}
.gcard .lvl{margin-top:6px;font-size:15px}
.gcard .go{margin-top:12px;display:inline-block;color:#fff;border-radius:999px;padding:6px 18px;font-weight:800}
.note{background:var(--yellow-soft);border:2px dashed var(--yellow);border-radius:18px;padding:14px 16px;margin-top:22px;font-size:16px}
.note b{color:var(--red-dark)}

/* map */
.ghead{display:flex;align-items:center;gap:14px;margin:20px 0 6px}
.ghead .ico{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:32px;flex:none}
.ghead h2{margin:0;font-size:28px;line-height:1}
.ghead small{color:var(--muted);font-weight:600}
.progress{height:16px;background:#F2E6C9;border-radius:999px;overflow:hidden;margin:10px 0 4px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),#FF9F1C);border-radius:999px;transition:width .5s}
.ptext{font-size:15px;color:var(--muted);font-weight:600}
.round{background:#fff;border-radius:26px;padding:16px 16px 20px;margin-top:18px;box-shadow:var(--shadow);border:3px solid var(--line)}
.rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rbadge{background:var(--red);color:#fff;border-radius:14px;padding:4px 12px;font-weight:800;font-size:15px}
.rhead h3{margin:0;font-size:22px}
.rhead .vi{color:var(--muted);font-weight:600;font-size:16px}
.trail{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:16px;position:relative}
.trail:before{content:"";position:absolute;left:8%;right:8%;top:34px;border-top:4px dashed #E8D6A8;z-index:0}
.stop{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;color:var(--ink)}
.dot{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:800;background:#fff;border:4px solid var(--yellow);box-shadow:0 4px 0 rgba(0,0,0,.08);transition:transform .15s}
.stop:hover .dot{transform:scale(1.06)}
.stop .lb{font-size:13px;font-weight:700;text-align:center;line-height:1.1;max-width:90px}
.stop.done .dot{background:var(--yellow);border-color:#F2A900}
.stop.now .dot{background:var(--red);color:#fff;border-color:var(--red-dark);animation:pulse 1.6s infinite}
.stop.lock{cursor:not-allowed}
.stop.lock .dot{background:#F3EEE2;border-color:#E2D8C2;color:#BDB09A}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(227,38,46,.45)}50%{box-shadow:0 0 0 10px rgba(227,38,46,0)}}
@media (max-width:560px){
  .trail{grid-template-columns:repeat(3,1fr);row-gap:16px}
  .trail:before{display:none}
  .dot{width:60px;height:60px}
}
.final{background:linear-gradient(135deg,var(--yellow),#FFAA2C);border-radius:26px;padding:20px;margin-top:18px;text-align:center;box-shadow:var(--shadow)}
.final h3{margin:4px 0;font-size:26px}
.final.lock{filter:grayscale(.6);opacity:.75}

/* day */
.dayhead{margin:18px 0 10px}
.dayhead .crumb{color:var(--muted);font-weight:700;font-size:15px}
.dayhead h2{margin:2px 0;font-size:30px;line-height:1.1}
.steps{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.stepbtn{flex:none;border:3px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px;color:var(--ink);display:flex;gap:6px;align-items:center}
.stepbtn.on{background:var(--red);border-color:var(--red-dark);color:#fff}
.stepbtn .ck{color:var(--green)}
.stepbtn.on .ck{color:var(--yellow)}
.panel{background:#fff;border-radius:26px;padding:18px;box-shadow:var(--shadow);border:3px solid var(--line)}
.panel h3{margin:0 0 4px;font-size:22px}
.panel .hint{color:var(--muted);font-size:15px;margin:0 0 12px}

/* flashcards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (max-width:400px){.fc .pic{font-size:52px;height:70px}.fc .en{font-size:20px}.fc .hz{font-size:26px}.sbtn{padding:6px 10px}.logo{font-size:16px}}
.fc{border:3px solid var(--line);border-radius:22px;padding:14px;text-align:center;background:var(--cream)}
.fc.heard{border-color:var(--yellow);background:var(--yellow-soft)}
.fc .pic{font-size:64px;line-height:1.1;height:84px;display:grid;place-items:center}
.fc .pic img{max-height:84px;max-width:100%;border-radius:12px}
.fc .en{font-size:24px;font-weight:800}
.fc .hz{font-size:30px;font-weight:700;color:var(--red-dark)}
.fc .py{font-size:16px;color:var(--muted)}
.fc .vi{font-size:14px;color:var(--muted)}
.say{display:flex;gap:8px;justify-content:center;margin-top:8px}
.sbtn{border:0;border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px;color:#fff;display:flex;align-items:center;gap:4px}
.sbtn.en{background:var(--sky)}
.sbtn.zh{background:var(--red)}
.sbtn:active{transform:scale(.95)}

/* games */
.gtabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.gtab{border:3px solid var(--line);background:var(--cream);border-radius:16px;padding:6px 14px;font-weight:800;font-size:15px;color:var(--ink)}
.gtab.on{border-color:var(--yellow);background:var(--yellow)}
.listen-big{display:flex;justify-content:center;margin:6px 0 14px}
.listen-big button{width:96px;height:96px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:44px;box-shadow:0 6px 0 var(--red-dark)}
.listen-big button:active{transform:translateY(3px);box-shadow:0 3px 0 var(--red-dark)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.opt{border:4px solid var(--line);background:#fff;border-radius:22px;padding:12px;font-size:56px;min-height:110px;display:grid;place-items:center}
.opt img{max-height:80px;max-width:100%}
.opt.ok{border-color:var(--green);background:#E6F7EE;animation:pop .4s}
.opt.no{border-color:var(--red);animation:shake .4s}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.gstat{text-align:center;font-weight:800;color:var(--muted);margin-top:10px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mi{border:4px solid var(--line);background:#fff;border-radius:18px;padding:10px;font-weight:800;font-size:20px;min-height:62px;color:var(--ink)}
.mi.zhi{font-size:24px}
.mi.sel{border-color:var(--sky);background:#EAF4FD}
.mi.matched{border-color:var(--green);background:#E6F7EE;opacity:.6;pointer-events:none}
.mi.no{border-color:var(--red);animation:shake .4s}
.win{text-align:center;padding:16px;font-size:22px;font-weight:800;color:var(--green)}

/* video task */
.sent{background:var(--yellow-soft);border-radius:20px;padding:16px;text-align:center;margin-bottom:12px}
.sent .en{font-size:24px;font-weight:800}
.sent .hz{font-size:28px;color:var(--red-dark);font-weight:700}
.sent .py{color:var(--muted)}
.task{border-left:6px solid var(--red);background:var(--cream);border-radius:12px;padding:12px 14px;margin:12px 0}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.three div{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center;font-size:14px;font-weight:700}
.three div b{display:block;color:var(--red);font-size:16px}
@media (max-width:480px){.three{grid-template-columns:1fr}}

.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:800;font-size:18px;color:#fff;background:var(--red);box-shadow:0 5px 0 var(--red-dark)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red-dark)}
.btn.y{background:var(--yellow);color:var(--ink);box-shadow:0 5px 0 #D9A200}
.btn.g{background:var(--green);box-shadow:0 5px 0 #2A8A57}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.donebar{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;font-weight:800}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty .big{font-size:60px}

/* finish */
.finish{text-align:center}
.finish .big{font-size:84px;animation:bob 2s infinite}
.stars{font-size:40px;letter-spacing:6px}
.checklist{list-style:none;padding:0;margin:14px auto;max-width:360px;text-align:left}
.checklist li{padding:8px 12px;border-radius:12px;background:var(--cream);margin-bottom:6px;font-weight:700}

.toast{opacity:0;visibility:hidden;position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;border-radius:16px;padding:10px 18px;font-size:16px;font-weight:700;transition:transform .3s;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti span{position:absolute;top:-30px;font-size:28px;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.tbtn{margin-top:10px;border:1px dashed var(--muted);background:transparent;color:var(--muted);border-radius:999px;padding:4px 12px;font-size:13px}
.foot{text-align:center;color:var(--muted);font-size:14px;margin-top:30px}

a.btn,a.gcard,a.lnk{text-decoration:none}
.trail{grid-template-columns:repeat(7,1fr)}
@media (max-width:640px){.trail{grid-template-columns:repeat(4,1fr);row-gap:16px}.trail:before{display:none}.dot{width:58px;height:58px;font-size:22px}}
.stop.zoom .dot{border-style:dashed;border-color:#7B5CD6}
.stop.zoom.now .dot{background:#7B5CD6;border-color:#5A3FB0;border-style:solid}
.stop.zoom .lb{color:#5A3FB0}
.sents{display:grid;gap:10px}
.sents .sent{margin:0;padding:12px}
.sents .sent .en{font-size:20px}.sents .sent .hz{font-size:24px}
.plist{margin:6px 0 4px;padding-left:22px}
.plist li{margin-bottom:10px;padding-left:4px}
.plist li::marker{color:var(--red);font-weight:800}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.lnk{border-radius:14px;padding:8px 14px;font-weight:700;font-size:15px;border:2px solid var(--line);background:var(--cream);color:var(--ink)}
.lnk.video{background:#FFECEC;border-color:#F7B9BC}
.lnk.card{background:#EAF4FD;border-color:#B9D8F3}
.lnk.game{background:var(--yellow-soft);border-color:var(--yellow)}
.lnk.story{background:#F3ECFF;border-color:#CDB8F5}
.tip{background:var(--yellow-soft);border-radius:14px;padding:10px 14px;margin-top:12px;font-size:16px}
.goal{background:#E6F7EE;border:2px solid #A9DFC1;border-radius:14px;padding:10px 14px;margin:12px auto;max-width:520px;text-align:left}
.which{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:420px;margin:0 auto}
.wbtn{border:4px solid var(--line);border-radius:24px;padding:16px;font-size:46px;font-weight:800;background:#fff;color:var(--ink);display:flex;flex-direction:column;align-items:center}
.wbtn small{font-size:15px;color:var(--muted)}
.wbtn.en{color:var(--sky)}.wbtn.zh{color:var(--red);font-family:'Noto Sans SC','PingFang SC',sans-serif}
.wbtn.ok{border-color:var(--green);background:#E6F7EE;animation:pop .4s}
.wbtn.no{border-color:var(--red);animation:shake .4s}
.reveal{text-align:center;font-size:24px;font-weight:800;min-height:36px;margin-top:10px}
.reveal small{font-size:15px;color:var(--muted)}
.zoompanel .zbadge{display:inline-block;background:#7B5CD6;color:#fff;border-radius:999px;padding:4px 14px;font-weight:800;font-size:15px}
.zoompanel .about{font-size:18px}
.prep{padding-left:22px}.prep li{margin-bottom:6px}
.finish .task{text-align:left;max-width:520px;margin:12px auto}

.links{flex-direction:column;align-items:stretch}
.media{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;gap:8px;align-items:center}
.mrow .lnk{flex:1;text-align:left;font-family:inherit;cursor:pointer}
.lnk.open{outline:3px solid var(--red)}
.ext{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:2px solid var(--line);background:#fff;color:var(--muted);text-decoration:none;font-weight:800}
.player{border-radius:16px;overflow:hidden;background:#000;border:3px solid var(--line)}
.player[hidden]{display:none}
.player iframe{display:block;width:100%;border:0}
.pvideo iframe{aspect-ratio:16/9}
.pgame{background:#fff}.pgame iframe{height:min(75vh,560px)}
.pfolder{background:#fff}.pfolder iframe{height:320px}
.player .hint{margin:6px 10px;background:#fff}

/* ===== hình hoạt hình ===== */
.art{display:inline-block;width:1em;height:1em;object-fit:contain;vertical-align:middle}
.artx{font-size:inherit;line-height:1}
.art.card{width:84px;height:84px}
.art.big{width:72px;height:72px;font-size:60px}
.art.sm{width:30px;height:30px;font-size:26px}
.art.tiny{width:24px;height:24px;font-size:20px}
.art.gi{width:44px;height:44px;font-size:38px}
.art.fl{width:46px;height:46px;font-size:40px}
.art.sa{width:58px;height:58px;font-size:48px}
.art.opta{width:76px;height:76px;font-size:60px}
.art.mia{width:30px;height:30px;font-size:24px;flex:none}
.art.rva{width:34px;height:34px;font-size:28px}
.art.zart{width:60px;height:60px;font-size:50px;flex:none}
.art.pmed{width:52px;height:52px;font-size:44px}
.art.spin{animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== header ===== */
.iconbtn{background:rgba(255,255,255,.2);border:0;border-radius:999px;width:36px;height:36px;font-size:18px;flex:none}
.star-count.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.35) rotate(-6deg)}}

/* ===== hero động ===== */
.hero .kicker{font-size:15px;font-weight:700;opacity:.9}
.hero h1{animation:rise .6s both}
.hero .tag{animation:rise .6s .15s both}
.hero p{animation:rise .6s .3s both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.hero .float{font-size:inherit}
.f1{left:5%;top:22px}.f2{right:6%;top:36px;animation-delay:1s!important}.f3{left:12%;bottom:58px;animation-delay:2s!important}.f4{right:14%;bottom:62px;animation-delay:.5s!important}
.cloud{position:absolute;background:rgba(255,255,255,.18);border-radius:999px;height:28px;animation:drift 26s linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud:before{width:40px;height:40px;left:14px;top:-18px}.cloud:after{width:30px;height:30px;left:44px;top:-12px}
.c1{width:110px;top:30px;left:-120px}.c2{width:90px;top:110px;left:-120px;animation-duration:34s;animation-delay:-12s}.c3{width:130px;top:70px;left:-140px;animation-duration:40s;animation-delay:-24s}
@keyframes drift{to{transform:translateX(calc(100vw + 260px))}}
.gcard{animation:pop-in .5s var(--d,0s) both}
.gcard .ico{animation:bob 3s ease-in-out infinite}
@keyframes pop-in{from{opacity:0;transform:scale(.85) translateY(10px)}}

.kidbar,.mycard{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px 14px;margin:14px 0 0;position:relative;z-index:3}
.kidbar{margin-top:-30px;margin-bottom:46px}
.linkish{border:0;background:none;color:var(--red);font-weight:800;text-decoration:underline;padding:0}
.ptable{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;font-size:15px;align-items:center}
.ptable span{background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:700}

/* ===== bản đồ ===== */
.ghead{flex-wrap:wrap}
.ghead .me{margin-left:auto;display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:6px 12px}
.ghead .me small{display:block;color:var(--red);font-weight:800}
.progress{position:relative;overflow:visible}
.progress i{border-radius:999px}
.walker{position:absolute;top:-6px;transform:translateX(-50%);transition:left .6s}
.stop{animation:pop-in .4s var(--d,0s) both}
.stop.now:not(.zoom) .dot{animation:pulse 1.6s infinite, hop 1.6s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.stop.done .dot{animation:shine 3s ease-in-out infinite}
@keyframes shine{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}
.rpts{margin-left:auto;background:var(--yellow-soft);border:2px solid var(--yellow);border-radius:999px;padding:2px 10px;font-weight:800;font-size:15px}
.gold{display:block;text-align:center;margin-top:14px;padding:8px;border-radius:14px;border:2px dashed #E8D6A8;color:var(--muted);font-weight:800;text-decoration:none}

function normAcct(s){ s=String(s||'').trim().toLowerCase(); if(s.includes('@')) return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s)?s:'';
  let d=s.replace(/\D/g,''); if(d.startsWith('84')) d='0'+d.slice(2); if(d.length===9) d='0'+d; return /^0\d{9,10}$/.test(d)?d:''; }

async function hashStr(s){
  try{ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('lle|'+s)); return [...new Uint8Array(b)].slice(0,8).map(x=>x.toString(16).padStart(2,'0')).join(''); }
  catch(e){ let h=5381; for(const c of s) h=((h*33)^c.codePointAt(0))>>>0; return 'h'+h.toString(16); }
}

/* gộp tiến độ: giữ bản nhiều điểm hơn của từng buổi */
function mergeProg(a,b){
  const out=Object.assign({},a||{});
  for(const k in (b||{})){ const x=out[k], y=b[k];
    if(!x){ out[k]=y; continue; }
    if(k==='_shop'){ out[k]=((y&&y.t)||0)>((x&&x.t)||0)?y:x; continue; }
    const sc=s=>(s.done?1000:0)+Object.keys(s.ls||{}).length*10+Object.keys(s.ex||{}).length*10+(s.clipSent?5:0);
    if(sc(y)>sc(x)) out[k]=y; }
  return out;
}

/* Bản đồ: mỗi chặng 6 buổi tự học. Buổi Zoom (ngày 7, 14, 21) không chặn đường đi,
   chỉ hiện ở cuối chặng. */
const LEARN_TOTAL = 18;
function isZoomIdx(i){ return i%PER===PER-1; }
function doneCount(g){ let n=0; for(let i=0;i<TOTAL;i++) if(!isZoomIdx(i) && isDone(g,i)) n++; return n; }
function prevLearn(i){ let k=i-1; while(k>=0 && isZoomIdx(k)) k--; return k; }
function isUnlocked(g,i){ if(DEMO) return i<DEMO_N; if(TEACHER) return true; const k=prevLearn(i); return k<0 || isDone(g,k); }
function nextLearn(i){ let k=i+1; while(k<TOTAL && isZoomIdx(k)) k++; return k<TOTAL?k:-1; }
function stageNo(i){ return Math.floor(i/PER)+1; }
function lessonNo(i){ return i%PER+1; }
function dayName(i){ return isZoomIdx(i) ? `buổi Zoom chặng ${stageNo(i)}` : `buổi ${lessonNo(i)} – chặng ${stageNo(i)}`; }
function dayPoints(g,i){ const s=P[g+'-'+i]; return dayPoints0(g,i) + (s && s.clipSent && !GROUPS[g].days[i].zoom ? PTS.clip : 0); }
function dayPoints0(g,i){
  const s=P[g+'-'+i], d=GROUPS[g].days[i]; if(!s) return 0;
  if(d.zoom) return s.done?PTS.zoom:0;
  if(d.cx) return cxDayPoints(s,d);
  if(d.ls) return lsDayPoints(s,d);
  return (s.learn?PTS.learn:0)+(s.parent?PTS.parent:0)+gamePts(s)+(s.done?PTS.done:0)+(s.done&&d.clip?PTS.clip:0);
}
function roundPoints(g,r){ let n=0; for(let i=r*PER;i<r*PER+PER;i++) n+=dayPoints(g,i); return n; }
function groupPoints(g){ return [0,1,2].reduce((a,r)=>a+roundPoints(g,r),0); }
function myPoints(){ if(KID && GROUPS[KID.group]) return groupPoints(KID.group); return Object.keys(GROUPS).reduce((a,g)=>a+groupPoints(g),0); }

/* MUTE chỉ tắt tiếng hiệu ứng (ting, pop…); giọng đọc bài học luôn phát */
let MUTE = lsGet('lle-sfx-off', false);
let actx=null;
function tone(seq){
  if(MUTE) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t=actx.currentTime;
    seq.forEach(([f,d,type])=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type||'triangle'; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.25,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.start(t); o.stop(t+d+.02); t+=d*.8;
    });
  }catch(e){}
}

const VOICE=new Audio(); VOICE.preload='auto'; try{ VOICE.setAttribute('playsinline',''); }catch(e){}
let voiceOK=false, voiceTok=0, voiceGateFn=null, voiceIdle=true;
function voiceUnlock(){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){}
  if(voiceGateFn){ const f=voiceGateFn; voiceGateHide(); f(); return; }  /* đang chờ chạm: chạm chỗ nào cũng phát tiếp */
  if(voiceOK || !voiceIdle) return;
  try{ VOICE.onended=null; VOICE.onerror=null; VOICE.src=VOICE_SIL; const p=VOICE.play(); if(p) p.then(()=>{ voiceOK=true; }).catch(()=>{}); }catch(e){}
}
['pointerdown','touchend','keydown','click'].forEach(ev=>document.addEventListener(ev, voiceUnlock, {capture:true, passive:true}));
function voiceGate(fn){
  voiceGateFn=fn; let g=document.getElementById('voiceGate');
  if(!g){ g=document.createElement('button'); g.id='voiceGate'; g.type='button';
    g.innerHTML='<span class="vg-ico">🔊</span><b>Chạm vào đây để nghe nhé!</b>';
    g.onclick=()=>{ const f=voiceGateFn; voiceGateHide(); f&&f(); };
    document.body.appendChild(g); }
  g.hidden=false;
}
function voiceGateHide(){ voiceGateFn=null; const g=document.getElementById('voiceGate'); if(g) g.hidden=true; }
/* phát file src; o.onend khi hết, o.onerr khi file hỏng; bị chặn thì hiện nút "chạm để nghe" */
/* o.start / o.end (giây): chỉ phát một đoạn của file (dùng cho truyện đọc liền một mạch) */
let voiceSegTimer=null;
function voicePlay(src, o){
  o=o||{}; const tok=++voiceTok;
  try{ VOICE.onended=null; VOICE.onerror=null; VOICE.pause(); }catch(e){}
  clearInterval(voiceSegTimer); VOICE_PAUSED=false;
  voiceGateHide(); voiceIdle=false;
  const same=VOICE.src && VOICE.src.endsWith(src);
  if(!same) VOICE.src=src;
  VOICE.defaultPlaybackRate=VOICE.playbackRate=o.rate||1;
  const fin=()=>{ if(tok===voiceTok){ clearInterval(voiceSegTimer); voiceIdle=true; o.onend&&o.onend(); } };
  VOICE.onended=fin;
  VOICE.onerror=()=>{ if(tok===voiceTok){ clearInterval(voiceSegTimer); voiceTok++; voiceIdle=true; o.onerr&&o.onerr(); } };
  if(o.start!=null){
    const seek=()=>{ try{ VOICE.currentTime=o.start; }catch(e){} };
    if(VOICE.readyState>=1) seek(); else VOICE.addEventListener('loadedmetadata', seek, {once:true});
  } else if(same){ try{ VOICE.currentTime=0; }catch(e){} }
  if(o.end!=null) voiceSegTimer=setInterval(()=>{ if(tok!==voiceTok){ clearInterval(voiceSegTimer); return; }
    if(!VOICE.paused && VOICE.currentTime>=o.end){ try{ VOICE.pause(); }catch(e){} fin(); } }, 40);
  const go=()=>{ let p; try{ p=VOICE.play(); }catch(e){ p=Promise.reject(e); }
    if(p&&p.then) p.then(()=>{ if(tok===voiceTok) voiceOK=true; }).catch(err=>{
      if(tok!==voiceTok) return;
      if(err&&err.name==='NotAllowedError') voiceGate(()=>{ if(tok===voiceTok) go(); });
      else if(!err||err.name!=='AbortError'){ voiceTok++; voiceIdle=true; o.onerr&&o.onerr(); }
    }); };
  go(); return tok;
}
function voiceStop(){ voiceTok++; voiceIdle=true; VOICE_PAUSED=false; clearInterval(voiceSegTimer); voiceGateHide(); try{ VOICE.onended=null; VOICE.onerror=null; VOICE.pause(); }catch(e){} }
/* tạm dừng / phát tiếp đúng chỗ đang đọc (nút ⏸ trong bài) */
let VOICE_PAUSED=false;
function voicePause(){ VOICE_PAUSED=true; try{ if(!voiceIdle) VOICE.pause(); }catch(e){} try{ speechSynthesis.pause(); }catch(e){} }
function voiceResume(){ VOICE_PAUSED=false; try{ if(!voiceIdle) VOICE.play().catch(()=>{}); }catch(e){} try{ speechSynthesis.resume(); }catch(e){} }

/* ---------- lời hướng dẫn tiếng Việt ----------
   Câu đã thu giọng cô Hươu: tra trong LS.hd (Little Seed) và HD_FILES (huong-dan.js).
   Câu chưa có file: đọc bằng giọng tiếng Việt của máy. */
function hdFile(text){ const L=window.LS; return (L&&L.hd&&L.hd[text]) || (window.HD_FILES&&window.HD_FILES[text]) || ''; }
const VI_MACHINE_VOICE = false;
function hdTTS(text, done){
  let fin=false; const end=()=>{ if(!fin){ fin=true; done&&done(); } };
  /* Không đọc tiếng Việt bằng giọng máy (nghe không hay, không phải giọng cô Hươu): câu chưa có file thu thì chỉ hiện chữ */
  if(!VI_MACHINE_VOICE) return setTimeout(end, 300);
  try{
    if(!('speechSynthesis' in window)) return setTimeout(end, 300);
    const v=voices.find(v=>/^vi/i.test(v.lang)); if(!v) return setTimeout(end, 300);
    const u=new SpeechSynthesisUtterance(text); u.voice=v; u.lang='vi-VN'; u.rate=1;
    u.onend=end; u.onerror=end; speechSynthesis.cancel(); speechSynthesis.speak(u);
    setTimeout(end, 2500+text.length*110);
  }catch(e){ setTimeout(end, 300); }
}
/* đọc một chuỗi câu hướng dẫn; trả về Promise; dừng khi có lời khác chen vào */
let hdTok=0;
function hdSay(lines){
  lines=[].concat(lines||[]).filter(Boolean); const tok=++hdTok;
  return new Promise(res=>{
    let k=0;
    const nx=()=>{ if(tok!==hdTok) return res(); if(k>=lines.length) return res();
      const t=lines[k++], f=hdFile(t);
      const after=()=>setTimeout(nx, 250);
      if(f) voicePlay(f,{onend:after, onerr:()=>hdTTS(t, after)}); else hdTTS(t, after); };
    nx();
  });
}
function hdStop(){ hdTok++; }

function speak(text, lang, file){
  if (file){ try{ speechSynthesis.cancel(); }catch(e){} if(curAudio){ try{curAudio.pause();}catch(e){} } voicePlay(file,{onerr:()=>speak(text,lang)}); return; }
  if (!('speechSynthesis' in window)){ toast('Máy này chưa hỗ trợ đọc to 😢'); return; }
  text = String(text||'').replace(/_+|…|\.\.\./g,' ').replace(/\s+/g,' ').trim();
  if(!text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const zh = lang==='zh';
  const v = voices.find(v=>v.lang.toLowerCase().replace('_','-').startsWith(zh?'zh-cn':'en-us'))
         || voices.find(v=>v.lang.toLowerCase().startsWith(zh?'zh':'en'));
  if (v) u.voice = v;
  else if (zh && voices.length && !warnedZh){ warnedZh=true; toast('Máy chưa có giọng đọc tiếng Trung — bố mẹ có thể cài thêm trong cài đặt giọng nói'); }
  u.lang = zh ? 'zh-CN' : 'en-US';
  u.rate = 0.8;
  speechSynthesis.speak(u);
}
let curAudio=null;
function zhKey(t){ let h=5381; for(const ch of String(t).trim()) h=((h*33)^ch.codePointAt(0))>>>0; return h.toString(36); }
function say(item, lang){
  if(lang==='zh') speak(item.zh,'zh', item.audioZh || (AUDIO_DIR ? AUDIO_DIR+'zh/'+zhKey(item.zh)+'.mp3' : ''));
  else speak(item.en,'en', item.audioEn || (AUDIO_DIR ? AUDIO_DIR+'en/'+imgSlug(item.en)+'.mp3' : ''));
}

const LINK_ICON = {video:'▶️', card:'🃏', game:'🎮', story:'📖'};
function embedUrl(u){
  let m;
  if(m=u.match(/youtu\.be\/([\w-]{6,})/)) return 'https://www.youtube.com/embed/'+m[1]+'?rel=0';
  if(m=u.match(/youtube\.com\/watch\?[^#]*v=([\w-]{6,})/)) return 'https://www.youtube.com/embed/'+m[1]+'?rel=0';
  if(m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)) return 'https://drive.google.com/file/d/'+m[1]+'/preview';
  if(m=u.match(/drive\.google\.com\/drive\/folders\/([\w-]+)/)) return 'https://drive.google.com/embeddedfolderview?id='+m[1]+'#grid';
  if(m=u.match(/wordwall\.net\/play\/(\d+\/\d+\/\d+)/)) return 'https://wordwall.net/embed/play/'+m[1];
  return '';
}
let embedSeq=0;
function linkBtns(links){
  if(!links || !links.length) return '';
  return `<div class="links">${links.map(l=>{
    const e=l.embed||embedUrl(l.url), id='emb'+(++embedSeq), folder=/embeddedfolderview/.test(e);

        ${e?`<button class="lnk ${l.kind} play" data-e="${esc(e)}" data-t="${id}" data-folder="${folder?1:''}">${LINK_ICON[l.kind]||'🔗'} ${esc(l.label)}</button>`
           :`<a class="lnk ${l.kind}" href="${esc(l.url)}" target="_blank" rel="noopener">${LINK_ICON[l.kind]||'🔗'} ${esc(l.label)} <span class="newtab">↗</span></a>`}

      </div><div class="player" id="${id}" hidden></div></div>`;}).join('')}</div>`;

/* Từ dùng cho trò chơi: từ của hôm nay; nếu ít thì lấy thêm từ các ngày trước để ôn */
function gamePool(g,i){
  const days=GROUPS[g].days, seen=new Set(), pool=[];
  const imgs=new Set(); const add=w=>{ if(!w || !w.en || !w.zh || seen.has(w.en) || pool.length>=6) return; const it=w.img?w:Object.assign({},w,{img:sentArt(w)}); if(imgs.has(it.img)) return; seen.add(w.en); imgs.add(it.img); pool.push(it); };
  (days[i].w||[]).forEach(add);
  for(let k=i-1;k>=0 && pool.length<6;k--) (days[k].w||[]).forEach(add);
  if(pool.length<4){ (days[i].s||[]).forEach(add); for(let k=i-1;k>=0 && pool.length<4;k--) (days[k].s||[]).forEach(add); }
  return pool;
}

function xtPick(g,r,n){
  const X=window.XEM_THEM; if(!X||!X[g]||!X[g][r]) return [];
  let reach=0; for(let i=0;i<21;i++) if(isUnlocked(g,i)) reach=i+1;
  const ok=it=> TEACHER || (g==='seed' ? it[2]<=reach : r*7+it[2]<=reach);
  const vids=X[g][r].v.map((it,k)=>({it,k})).filter(o=>ok(o.it));
  const yt=vids.filter(o=>o.it[3].startsWith('y:'));
  const pick=[], en=yt.filter(o=>o.it[0]==='en'), zh=yt.filter(o=>o.it[0]==='zh');
  const seed=(new Date()).getDate();
  if(en.length) pick.push(en[seed%en.length]); if(zh.length) pick.push(zh[seed%zh.length]);
  for(const o of vids){ if(pick.length>=n) break; if(!pick.includes(o)) pick.push(o); }
  return pick.slice(0,n);
}
function xtTeaser(g,r,title){

let cur = {};
function head(g,i){
  const G=GROUPS[g], R=ROUNDS[Math.floor(i/PER)], day=G.days[i];
  return `<div class="dayhead">
    <div class="crumb">${G.icon} ${esc(G.name)} · Chặng ${stageNo(i)}: ${R.vi} · ${day.zoom?'Buổi Zoom':'Buổi '+lessonNo(i)+'/6'} · <b>${dayPoints(g,i)} điểm</b></div>
    <h2>${titleHTML(day.t)}</h2></div>`;
}
/* tiêu đề "Anh – Trung": giữ cụm tiếng Trung trên một dòng, không để "好！" rơi xuống dòng riêng */
function titleHTML(t){ return String(t||'').split(' – ').map(x=>/[㐀-鿿]/.test(x)?`<span class="nw">${esc(x)}</span>`:esc(x)).join(' – '); }
function viewDay(g,i,step){
  const G=GROUPS[g]; const day=G && G.days[i];
  if(!day) return viewHome();
  if(!KID){ app.innerHTML=''; return askProfile(g, ()=>viewDay(g,i,step)); }
  if(!isUnlocked(g,i)){ if(DEMO) setTimeout(()=>demoGate(),200); else toast('Buổi này chưa mở khóa 🔒'); location.hash='#/g/'+g; return; }
  cur={g,i,day};
  if(day.zoom) return viewZoom(g,i);
  if(day.cx) return viewCanopyDay(g,i,step);
  if(day.ls) return viewSeedDay(g,i,step);
  const s=st(g,i);
  const hasLearn = (day.w&&day.w.length)||(day.s&&day.s.length);
  const steps=[];
  if(hasLearn) steps.push(['learn','🃏','Học từ']);
  steps.push(['parent','👨‍👩‍👧','Cùng ba mẹ'],['game','🎮','Trò chơi'],['finish','🏁','Hoàn thành']);
  if(!steps.some(x=>x[0]===step)) step=steps[0][0];
  cur.steps=steps.map(x=>x[0]);
  app.innerHTML = `<div class="wrap">${head(g,i)}
    <div class="steps">${steps.map(([k,ic,t])=>`<button class="stepbtn ${k===step?'on':''}" data-s="${k}">${ic} ${t} ${s[k]||(k==='finish'&&s.done)?'<span class="ck">✔</span>':''}</button>`).join('')}</div>
    <div class="panel pin" id="panel"></div>
    <div class="row"><a class="btn y" href="#/g/${g}">← Về bản đồ</a></div></div>`;
  app.querySelectorAll('.stepbtn').forEach(b=>b.onclick=()=>{ sfx.pop(); viewDay(g,i,b.dataset.s); });
  ({learn:stepLearn, parent:stepParent, game:stepGame, finish:stepFinish})[step]();
  window.scrollTo({top:0});
}
function nextStep(k){ const a=cur.steps; return a[a.indexOf(k)+1]; }
function mark(k, go, el){
  const s=st(cur.g,cur.i), before=dayPoints(cur.g,cur.i);
  if(!s[k]){ s[k]=true; addPoints(cur.g,cur.i,before,el); }
  if(go) setTimeout(()=>viewDay(cur.g,cur.i,nextStep(k)), s._fast?0:REDUCED?0:450);
}
function nextLabel(k){ return ({parent:'Cùng ba mẹ',game:'Trò chơi',finish:'Hoàn thành'})[nextStep(k)]; }

/* Bước: trò chơi */
function stepGame(mode){
  const pool=gamePool(cur.g,cur.i);
  const s=st(cur.g,cur.i);
  const panel=document.getElementById('panel');
  if(pool.length<2){ panel.innerHTML='<div class="empty">Hôm nay chưa có từ để chơi.</div>'; return; }
  const isOpen=k=>TEACHER || k===0 || (s.gp && GAMES[k-1][0] in s.gp);
  let idx=GAMES.findIndex(g=>g[0]===mode);
  if(idx<0 || !isOpen(idx)){ idx=GAMES.findIndex(([k])=>!(s.gp && k in s.gp)); if(idx<0) idx=0; }
  mode=GAMES[idx][0]; cur.gameMode=mode;
  const gl=(cur.day.links||[]).filter(l=>l.kind==='game');
  panel.innerHTML = `<h3>🎮 Trò chơi luyện tập · Trò ${idx+1}/4</h3>
    <p class="hint">Con chơi lần lượt 4 trò, xong trò này sẽ mở trò tiếp theo. Mỗi trò được tối đa ${PTS.perGame} điểm. Đã xong <b>${gamesDone(s)}/4</b> trò · <b>${gamePts(s)}</b> điểm.</p>
    <div class="gtabs gseq">${GAMES.map(([k,t],n)=>{ const done=s.gp&&k in s.gp, open=isOpen(n);
      return `<button class="gtab ${k===mode?'on':''} ${done?'gdone':''} ${open?'':'glock'}" data-n="${n}">${done?'✅':open?'':'🔒'} ${n+1}. ${t.replace(/^\S+\s/,'')}</button>`; }).join('')}</div>
    <div id="gbox"></div>
    ${gl.length?`<p class="hint" style="margin-top:16px">Game của cô trên Wordwall:</p>${linkBtns(gl)}`:''}`;
  panel.querySelectorAll('.gtab').forEach(b=>b.onclick=()=>{ const n=+b.dataset.n;
    if(!isOpen(n)){ sfx.no(); toast('Chơi xong trò '+n+' để mở trò này nhé! 🔒'); return; }
    sfx.pop(); stepGame(GAMES[n][0]); });
  const box=document.getElementById('gbox'); streak=0;
  ({listen:()=>gameListen(box,pool), match:()=>gameMatch(box,pool), pinyin:()=>gamePinyin(box,pool), hanzi:()=>gameHanzi(box,pool)})[mode]();
}
function gameWin(box,score,total,msg,again){
  const s=st(cur.g,cur.i), before=dayPoints(cur.g,cur.i), mode=cur.gameMode;
  s.gp=s.gp||{}; s.gp[mode]=Math.max(s.gp[mode]||0, Math.round(Math.max(0,score)/Math.max(1,total)*PTS.perGame));
  const n=GAMES.findIndex(g=>g[0]===mode), next=GAMES[n+1];
  if(gamesDone(s)===GAMES.length) s.game=true;
  confetti(); sfx.win(); mascot('ok');
  box.innerHTML=`<div class="win">${art('🎉','big')}<div>${msg}</div><div class="stars3">${'⭐'.repeat(Math.max(1,Math.round(Math.max(0,score)/total*3)))}</div>
      <div class="hint">Xong trò ${n+1}/4${next?'. Trò tiếp theo: '+next[1]:'. Con đã chơi hết 4 trò!'}</div></div>
    <div class="row"><button class="btn y" id="again">Chơi lại</button><button class="btn" id="nx">${next?'Tiếp: Trò '+(n+2)+' →':'Tiếp: Hoàn thành →'}</button></div>`;
  addPoints(cur.g,cur.i,before,box.querySelector('.win'));
  box.querySelector('#again').onclick=again;
  box.querySelector('#nx').onclick=()=> next ? stepGame(next[0]) : viewDay(cur.g,cur.i,'finish');
  const t=document.querySelector('.stepbtn[data-s=game]'); if(t && s.game && !t.querySelector('.ck')) t.insertAdjacentHTML('beforeend',' <span class="ck">✔</span>');
}
function gstat(i,n,score){ return `<div class="gstat"><div class="gbar"><i style="width:${i/n*100}%"></i></div>Câu ${i+1}/${n} · ✅ ${score}</div>`; }
function gameListen(box,words){
  const qs = shuffle(words.flatMap(w=>[{w,l:'en'},{w,l:'zh'}])).slice(0, Math.min(8, words.length*2));
  let i=0, score=0;
  (function q(){
    if(i>=qs.length) return gameWin(box,score,qs.length,`Giỏi quá! Đúng ${score}/${qs.length} câu`,()=>gameListen(box,words));
    const {w,l}=qs[i];
    const opts = shuffle([w, ...shuffle(words.filter(x=>x!==w)).slice(0,3)]);
    let tried=false;
    box.innerHTML=`<p class="hint" style="text-align:center">Bấm loa để nghe ${l==='zh'?'tiếng Trung 🇨🇳':'tiếng Anh 🇬🇧'}, rồi chọn hình đúng</p>
      <div class="listen-big"><button id="play" aria-label="Nghe">🔊</button></div>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}" style="--d:${k*.06}s">${art(o.img,'opta',o.en)}</button>`).join('')}</div>

    const play=()=>{ const p=box.querySelector('#play'); p.classList.remove('ring'); void p.offsetWidth; p.classList.add('ring'); say(w,l); };
    box.querySelector('#play').onclick=play; setTimeout(play,350);
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(opts[+b.dataset.k]===w){ b.classList.add('ok'); if(!tried) score++; sfx.ok(); combo(!tried,b); mascot('ok');
        setTimeout(()=>say(w, l==='en'?'zh':'en'),300);
        box.querySelectorAll('.opt').forEach(x=>x.onclick=null); setTimeout(()=>{i++;q();},1500); }
      else { tried=true; sfx.no(); combo(false); mascot('no'); b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); }
    });
  })();
}
function gameMatch(box,words){
  words=words.slice(0,6);
  const L=shuffle(words.map((w,i)=>({i,t:w.en}))), R=shuffle(words.map((w,i)=>({i,t:w.zh})));

    <div class="mcol">${R.map((x,k)=>`<button class="mi zhi zh" data-side="R" data-i="${x.i}" style="--d:${k*.05+.1}s">${esc(x.t)}</button>`).join('')}</div></div>`;

function missionWire(root,g,i){
  root.querySelectorAll('.mi-done').forEach(b=>b.onclick=()=>{
    const s=st(g,i), before=dayPoints(g,i); s.clipSent=true; addPoints(g,i,before,b);

    sfx.win(); confetti(18); toast('Cảm ơn ba mẹ! Con được thêm '+PTS.clip+' điểm 🎉');

/* ---------- thu giọng con (dùng chung Little Seed và Canopy) ----------
   Tự bật khi đến lượt con, hiện chấm đỏ "Đang thu", tự dừng khi con nói xong (hoặc hết giờ),
   rồi phát lại giọng con. Máy không cho dùng micro thì trả về null để bài chạy kiểu đếm 3-2-1. */
let recStream=null, recCur=null;
async function recMic(){
  if(recStream && recStream.getTracks().some(t=>t.readyState==='live')) return recStream;
  try{ recStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); }catch(e){ recStream=null; }
  return recStream;
}
function recAbort(){ if(recCur){ const c=recCur; recCur=null; c.abort(); } }
/* o: {maxMs, onLevel(0..1), onStart} → Promise<{url, blob, spoke} | null> */
function recTake(o){
  o=o||{};
  return new Promise(async res=>{
    const stream=await recMic();
    if(!stream || !window.MediaRecorder){ return res(null); }
    let rec; try{ rec=new MediaRecorder(stream); }catch(e){ return res(null); }
    const chunks=[]; let done=false, spoke=false, quietSince=0, raf=0, an=null, src=null;
    try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume();
      an=actx.createAnalyser(); an.fftSize=512; src=actx.createMediaStreamSource(stream); src.connect(an); }catch(e){ an=null; }
    const buf=an?new Uint8Array(an.fftSize):null, t0=Date.now(), maxMs=o.maxMs||5000;
    const stop=(abort)=>{ if(done) return; done=true; cancelAnimationFrame(raf); clearTimeout(hard); try{ src&&src.disconnect(); }catch(e){}
      if(abort){ rec.onstop=()=>res(null); } try{ rec.state!=='inactive' ? rec.stop() : rec.onstop&&rec.onstop(); }catch(e){ res(null); } if(recCur===ctl) recCur=null; };
    const ctl={abort:()=>stop(true), finish:()=>stop(false)}; recCur=ctl;
    rec.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
    rec.onstop=()=>{ const blob=chunks.length?new Blob(chunks,{type:rec.mimeType||'audio/webm'}):null; res(blob?{blob,url:URL.createObjectURL(blob),spoke}:null); };
    const hard=setTimeout(()=>stop(false), maxMs);
    const tick=()=>{ if(done) return;
      if(an){ an.getByteTimeDomainData(buf); let m=0; for(const v of buf) m=Math.max(m,Math.abs(v-128)); const lv=Math.min(1,m/60);
        o.onLevel&&o.onLevel(lv); const now=Date.now();
        if(lv>0.18){ spoke=true; quietSince=0; } else if(spoke){ quietSince=quietSince||now; if(now-quietSince>1100 && now-t0>1200) return stop(false); } }
      raf=requestAnimationFrame(tick); };
    try{ rec.start(); }catch(e){ return res(null); }
    o.onStart&&o.onStart(); tick();
  });
}
/* phát lại giọng con; trả Promise khi phát xong */
function recPlay(url){ return new Promise(res=>{ if(!url) return res(); voicePlay(url,{onend:res, onerr:res}); }); }

/* ---------- ngày Zoom ---------- */
function viewZoom(g,i){
  const day=cur.day, s=st(g,i), r=Math.floor(i/PER);
  app.innerHTML=`<div class="wrap">${head(g,i)}
    <div class="panel zoompanel pin">
      <div class="zhead">${art('💻','zart')}<div><div class="zbadge">🎥 Buổi Zoom cùng giáo viên · ${ROUNDS[r].vi}</div>
      <div class="hint">Tham gia buổi Zoom được +${PTS.zoom} điểm. Buổi Zoom không bắt buộc để mở chặng sau. Kết thúc chặng, Top 10 được vinh danh trên Bảng vàng!</div></div></div>
      <p class="about">${esc(day.about)}</p>
      ${day.prep&&day.prep.length?`<h3>📝 Con ôn lại trước buổi Zoom</h3><ul class="prep">${day.prep.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
      <div class="row">${ZOOM_LINK?`<a class="btn" href="${esc(ZOOM_LINK)}" target="_blank" rel="noopener">🎥 Vào phòng Zoom</a>`:''}
        <a class="btn y" href="${ZALO_LINK}" target="_blank" rel="noopener">💬 ${ZOOM_LINK?'Nhóm Zalo':'Xem link Zoom trên nhóm Zalo'}</a></div>
      ${linkBtns(day.links)}
      <div id="zdone"></div>
    </div>
    <div class="row"><a class="btn y" href="#/g/${g}">← Về bản đồ</a></div></div>`;
  const zd=document.getElementById('zdone');
  if(s.done){ showDone(zd,false); }
  else { zd.innerHTML=`<div class="row"><button class="btn g" id="ok">✅ Con đã tham gia buổi Zoom</button></div>`;
    zd.querySelector('#ok').onclick=e=>{ const before=dayPoints(g,i); s.done=true; addPoints(g,i,before,e.currentTarget); showDone(zd,true); }; }
  window.scrollTo({top:0});
}

/* ---------- BẢN HỌC THỬ: hồ sơ chỉ cần tên con, ruy băng và bảng mời đăng ký ---------- */
function demoDone(g){ let n=0; for(let i=0;i<DEMO_N;i++) if(isDone(g,i)) n++; return n; }
function demoProfile(g, then){
  const ov=document.createElement('div'); ov.className='overlay pf';
  ov.innerHTML=`<form class="modal" id="pf" novalidate>
    <div class="mart"><img class="mportrait cut" src="tai-nguyen/nhan-vat/kids_bong_a.webp" alt=""></div>
    <h3>Học thử miễn phí</h3>
    <p class="hint">Con được học thử ${DEMO_N} buổi đầu của mỗi khoá. Ba mẹ chỉ cần nhập tên con, không cần số điện thoại.</p>
    <label for="kname">Tên của con</label>
    <input id="kname" required maxlength="24" autocomplete="off" placeholder="Ví dụ: Bông, Minh An" value="${esc(KID&&KID.name||'')}">
    <p class="pf-err" id="pferr" hidden></p>
    <div class="row"><button class="btn" type="submit">Học thử ngay! 🚀</button></div>
  </form>`;
  document.body.appendChild(ov);
  ov.querySelector('#kname').focus();
  ov.querySelector('#pf').addEventListener('submit',e=>{
    e.preventDefault();
    const name=ov.querySelector('#kname').value.trim(), err=ov.querySelector('#pferr');
    if(!name){ err.hidden=false; err.textContent='Ba mẹ nhập tên của con nhé.'; return; }
    KID={name, id:'demo-'+slugName(name), group:g, demo:true};
    lsSet(KID_KEY,KID); ov.remove(); sfx.win(); updateStars(); then&&then();
  });
}
const demoShown={};
function demoCheckDone(){
  if(!DEMO || !KID || !GROUPS[KID.group]) return; const g=KID.group;
  if(demoShown[g] || demoDone(g)<DEMO_N || lsGet('lle-demo-xong-'+g,false)) return;
  demoShown[g]=true; lsSet('lle-demo-xong-'+g,true);
  setTimeout(()=>demoGate('xong'), 2200);
}
function demoGate(why){
  if(!DEMO || document.querySelector('.overlay.demo')) return;
  const G=KID&&GROUPS[KID.group], nm=KID&&KID.name?esc(KID.name):'Con';
  const h = why==='xong' ? `${nm} đã học xong ${DEMO_N} buổi học thử! 🎉`
          : why==='vang' ? 'Bảng vàng dành cho nhà thám hiểm đã đăng ký 🏆'
          : why==='qua'  ? 'Đổi quà thật dành cho nhà thám hiểm đã đăng ký 🎁'
          : 'Phần này dành cho nhà thám hiểm đã đăng ký 🔒';
  const ov=document.createElement('div'); ov.className='overlay pp demo';
  ov.innerHTML=`<div class="modal pp-box dm-box" role="dialog" aria-label="Đăng ký tham gia">
    <button class="pp-x" aria-label="Đóng">✕</button>
    <img class="dm-img" src="tai-nguyen/trang/ls_man_khen.webp" alt="">
    <h3>${h}</h3>
    <p>Bản học thử mở <b>${DEMO_N} buổi đầu</b> của mỗi khoá. Đăng ký <b>Thử thách 21 ngày Bật phản xạ Anh – Trung</b> để con đi tiếp cả hành trình:</p>
    <ul class="dm-list">
      <li>🗺️ Đủ <b>18 buổi tự học</b> qua 3 chặng: Vòng khám phá → Vòng bứt phá → Vòng chinh phục</li>
      <li>🎥 <b>3 buổi Zoom</b> cùng cô giáo, cuối mỗi chặng</li>
      <li>🏆 <b>Bảng vàng Top 10</b> mỗi chặng và <b>Phòng đổi quà</b> bằng sao</li>
      <li>🌟 <b>Chung kết tỏa sáng</b> livestream: cúp, cờ và giấy chứng nhận cho Top 3 mỗi khoá</li>
    </ul>
    <p class="dm-info">Phí <b>${DEMO_FEE}</b> cho sự kiện và học liệu 21 ngày · Hạn đăng ký: <b>${DEMO_HAN}</b> · Khai mạc: <b>${DEMO_KHAI_MAC}</b></p>
    <div class="row"><a class="btn g" href="${DANG_KY_LINK}" target="_blank" rel="noopener">📝 Đăng ký cho con</a>
      <button class="btn y" id="dmLater" type="button">${why==='xong'?'Xem lại bài đã học':'Để sau'}</button></div>
  </div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.querySelector('.pp-x').onclick=close; ov.querySelector('#dmLater').onclick=close;
  ov.addEventListener('click',e=>{ if(e.target===ov) close(); });
  if(why==='xong'){ confetti(40); sfx.win(); }
}
if(DEMO){
  document.body.classList.add('is-demo');
  const rb=document.createElement('a'); rb.className='demo-rb'; rb.href='#'; rb.setAttribute('role','button');
  rb.innerHTML='<b>Bản học thử</b><span>· '+DEMO_N+' buổi mỗi khoá ·</span><i>Đăng ký học đủ 21 ngày →</i>';
  rb.onclick=e=>{ e.preventDefault(); sfx.pop(); demoGate(); };
  document.body.appendChild(rb);
}

function route(){
  try{ speechSynthesis.cancel(); }catch(e){} voiceStop(); hdStop(); recAbort();
  document.body.classList.remove('hub'); document.querySelectorAll('.overlay.pp').forEach(x=>x.remove());
  document.querySelectorAll('.overlay:not(.pf):not(.tour)').forEach(x=>x.remove());
  if(typeof cxStop==='function'){ cxStop(); if(window.cxStopListen) window.cxStopListen(); }
  if(typeof lsEnd==='function') lsEnd();
  const p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  document.querySelectorAll('.ls-cele').forEach(e=>e.remove());
  document.body.classList.toggle('in-step', p[0]==='g' && p.length>=4 && /^b\d+$/.test(p[3]||''));
  if(p[0]==='g' && p[1] && p[2]==='vang') viewGold(p[1], +(p[3]||0));
  else if(p[0]==='g' && p[1] && p[2]==='them') viewXemThem(p[1], +(p[3]||1), p[4]&&/^v\d+$/.test(p[4])?+p[4].slice(1):-1);
  else if(p[0]==='g' && p[1] && p[2]) viewDay(p[1], +p[2]-1, p[3]);
  else if(p[0]==='g' && p[1]) viewGroup(p[1]);
  else if(p[0]==='qua') viewQua(p[1]);
  else viewHome();
  artWatch();
}
window.addEventListener('hashchange', route);
document.getElementById('muteIc').textContent=MUTE?'🔇':'🔊';
document.getElementById('muteBtn').onclick=toggleMute;
updateStars(); route(); showSplash();
/* thanh bên trái */
document.getElementById('sdBack').onclick=()=>{ sfx.pop(); const p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  if(p[0]==='qua'){ location.hash=p[1]?'#/qua':'#/'; return; }
  if(p.length>=4) location.hash='#/g/'+p[1]+'/'+p[2]; else if(p.length>=3) location.hash='#/g/'+p[1]; else location.hash='#/'; };
document.getElementById('sdHelp').onclick=()=>{ sfx.pop(); startTour(true); };
document.getElementById('sdKid').onclick=()=>{ sfx.pop(); if(KID&&!KID.temp) parentPanel(); else askProfile(KID&&KID.group||'', route); };

document.querySelector('#mascot .mimg').innerHTML='<img class="art mcut" src="tai-nguyen/nhan-vat/kids_bong_a.webp" alt="">';
</script>
