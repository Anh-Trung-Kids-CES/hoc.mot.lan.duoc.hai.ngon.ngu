<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Màn cô · Trình chiếu tương tác</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="tc.css?v=1">
<style>
  html, body { height: 100%; overflow: hidden; background: #14171F; }
  #wrap { position: fixed; inset: 0 0 56px 0; display: grid; place-items: center; }
  #stage { position: relative; width: min(100vw, calc((100vh - 56px) * 16 / 9)); aspect-ratio: 16 / 9; background: var(--bg); overflow: hidden; container-type: inline-size; }
  #stage img.slide { width: 100%; height: 100%; display: block; object-fit: contain; }
  .scr { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 28cqw; gap: 3.2cqw; padding: 4.2cqw 5cqw 3.5cqw; align-items: start; }
  .eyebrow { font-size: 1.35cqw; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--red); margin: 0 0 1.2cqw; }
  .q { font-size: 2.7cqw; line-height: 1.25; font-weight: 800; margin: 0 0 2cqw; text-wrap: balance; }
  .opts { display: flex; flex-direction: column; gap: 1cqw; }
  .opt { position: relative; background: var(--paper); border: .15cqw solid var(--line); border-radius: .9cqw; padding: .9cqw 1.3cqw; display: grid; grid-template-columns: 2.6cqw 1fr auto; align-items: center; gap: 1.2cqw; overflow: hidden; }
  .opt .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--bar-track); transition: width .6s cubic-bezier(.2,.8,.2,1); z-index: 0; }
  .opt > * { position: relative; z-index: 1; }
  .opt .k { width: 2.6cqw; height: 2.6cqw; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 1.3cqw; }
  .opt .t { font-size: 1.6cqw; font-weight: 600; line-height: 1.3; }
  .opt .v { font-size: 1.9cqw; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 9cqw; text-align: right; }
  .opt .v small { font-size: 1.15cqw; font-weight: 600; color: var(--muted); margin-left: .5cqw; }
  .reveal .opt { opacity: .55; }
  .reveal .opt.ok { opacity: 1; border-color: var(--ok); background: var(--ok-soft); }
  .reveal .opt.ok .fill { background: #BFE5CD; }
  .reveal .opt.ok .k { background: var(--ok); }
  .giai { margin-top: 1.3cqw; background: var(--gold-soft); border-radius: .9cqw; padding: 1cqw 1.4cqw; font-size: 1.4cqw; line-height: 1.45; }
  .giai b { color: var(--ok); }
  .side { display: flex; flex-direction: column; gap: 1.4cqw; align-items: stretch; justify-content: center; align-self: center; }
  .qrbox { background: var(--paper); border: .15cqw solid var(--line); border-radius: 1.2cqw; padding: 1.8cqw; display: flex; flex-direction: column; align-items: center; gap: 1cqw; text-align: center; }
  .qrbox .qr { width: 17cqw; height: 17cqw; display: grid; place-items: center; }
  .qrbox .qr img, .qrbox .qr canvas { width: 100% !important; height: 100% !important; image-rendering: pixelated; }
  .qrbox .lbl { font-size: 1.3cqw; color: var(--muted); }
  .qrbox .url { font-size: 1.15cqw; font-weight: 700; word-break: break-all; }
  .count { background: var(--ink); color: #fff; border-radius: 1.2cqw; padding: 1.4cqw 1.8cqw; }
  .count .n { font-size: 4.2cqw; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .count .c { font-size: 1.3cqw; opacity: .8; margin-top: .5cqw; }
  .state { font-size: 1.25cqw; font-weight: 700; color: var(--red); text-align: center; }
  .join { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 34cqw; gap: 4cqw; align-items: center; padding: 6cqw; }
  .join h1 { font-size: 4.6cqw; line-height: 1.12; margin: 0 0 2cqw; font-weight: 800; text-wrap: balance; }
  .join p { font-size: 1.9cqw; line-height: 1.5; color: var(--muted); margin: 0 0 1.4cqw; }
  .join .qrbox .qr { width: 24cqw; height: 24cqw; }
  .join .people { font-size: 1.7cqw; font-weight: 700; color: var(--ink); }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; background: #0E1016; color: #E8EAF0; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 14px; }
  #bar button { background: #262B38; color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; white-space: nowrap; }
  #bar button.on { background: var(--red); }
  #bar button:disabled { opacity: .35; cursor: default; }
  #bar .sp { flex: 1; }
  #bar .pos { font-variant-numeric: tabular-nums; min-width: 92px; text-align: center; }
  #bar .msg { color: #F7C873; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #toast { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); background: #0E1016; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="wrap"><div id="stage" aria-live="polite"></div></div>
<div id="bar">
  <button id="bPrev" title="Trang trước (←)">◀</button>
  <span class="pos" id="pos">–</span>
  <button id="bNext" title="Trang sau (→ hoặc Space)">▶</button>
  <button id="bOpen" title="Mở hoặc khoá bình chọn (O)">Khoá bình chọn</button>
  <button id="bReveal" title="Hiện đáp án (R)">Hiện đáp án</button>
  <span class="msg" id="msg"></span>
  <span class="sp"></span>
  <span id="people">0 bố mẹ</span>
  <button id="bCsv">Tải kết quả (CSV)</button>
  <button id="bFull" title="Toàn màn hình (F)">Toàn màn hình</button>
</div>
<div id="toast"></div>

<script src="../lop-zoom/vendor/firebase-app-compat.js?v=20261109a"></script>
<script src="../lop-zoom/vendor/firebase-auth-compat.js?v=20261109a"></script>
<script src="../lop-zoom/vendor/firebase-database-compat.js?v=20261109a"></script>
<script src="qrcode.js?v=1"></script>
<script src="tc.js?v=4"></script>
<script>
(async function () {
  const $ = s => document.querySelector(s);
  const SEQ = tcSequence();
  const ROOM = tcRoom();
  const LINK = tcVoteLink(ROOM);
  const stage = $('#stage');
  let st = { i: 0, open: true, reveal: false };
  let answers = {}, players = {};
  let F = null, R = null, isTeacher = false;

  function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => e.classList.remove('show'), 2200); }
  function msg(t) { $('#msg').textContent = t || ''; }

  function qr(el, size) {
    try {
      const q = qrcode(0, 'M'); q.addData(LINK); q.make();
      el.innerHTML = q.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
      const svg = el.querySelector('svg'); if (svg) { svg.style.width = '100%'; svg.style.height = '100%'; }
    } catch (e) { el.textContent = LINK; }
  }
  const online = () => Object.values(players).filter(p => p && p.on).length;
  const shortLink = LINK.replace(/^https?:\/\//, '');

  function render() {
    const it = SEQ[st.i] || SEQ[0];
    const total = SEQ.length;
    $('#pos').textContent = (st.i + 1) + ' / ' + total;
    $('#bPrev').disabled = st.i <= 0; $('#bNext').disabled = st.i >= total - 1;
    const isPoll = it.kind === 'poll';
    $('#bOpen').disabled = !isPoll; $('#bReveal').disabled = !isPoll || tcPoll(it.poll).dung == null;
    $('#bOpen').textContent = st.open ? 'Khoá bình chọn' : 'Mở bình chọn';
    $('#bOpen').classList.toggle('on', isPoll && !st.open);
    $('#bReveal').classList.toggle('on', isPoll && st.reveal);
    $('#people').textContent = online() + ' bố mẹ đang vào';
    if (it.kind === 'slide') {
      if (!stage.querySelector('img.slide') || stage.dataset.k !== 's' + it.slide) {
        stage.dataset.k = 's' + it.slide;
        stage.innerHTML = '<img class="slide" alt="Slide ' + it.slide + '" src="' + tcImg(it.slide) + '">';
      }
      return;
    }
    if (it.kind === 'join') {
      if (stage.dataset.k !== 'join') {
        stage.dataset.k = 'join';
        stage.innerHTML = '<div class="join"><div><p class="eyebrow">Buổi chia sẻ tối 18/11 · CES Việt Nam</p>' +
          '<h1>Bố mẹ quét mã để cùng trả lời câu hỏi trong buổi chia sẻ</h1>' +
          '<p>Mở camera điện thoại, quét mã bên phải. Trước mỗi phần quan trọng, cô hỏi một câu; bố mẹ chạm chọn đáp án, kết quả hiện ngay trên màn này.</p>' +
          '<p class="people" id="jpeople"></p></div>' +
          '<div class="qrbox"><div class="qr" id="qr"></div><div class="lbl">hoặc mở</div><div class="url">' + tcEsc(shortLink) + '</div></div></div>';
        qr($('#qr'), 600);
      }
      $('#jpeople').textContent = online() ? online() + ' bố mẹ đã vào phòng' : 'Đang chờ bố mẹ vào phòng…';
      return;
    }
    const p = tcPoll(it.poll);
    const { c, n } = tcCount(p, answers[p.id]);
    if (stage.dataset.k !== 'p' + p.id) {
      stage.dataset.k = 'p' + p.id;
      stage.innerHTML = '<div class="scr"><div><p class="eyebrow">' + tcEsc(p.nhan) + ' · bố mẹ trả lời trên điện thoại</p>' +
        '<h2 class="q">' + tcEsc(p.hoi) + '</h2><div class="opts" id="opts">' +
        p.chon.map((t, k) => '<div class="opt' + (k === p.dung ? ' isok' : '') + '" data-k="' + k + '"><span class="fill"></span><span class="k">' + 'ABCD'[k] + '</span><span class="t">' + tcEsc(t) + '</span><span class="v">0<small>0%</small></span></div>').join('') +
        '</div><div id="giai"></div></div>' +
        '<div class="side"><div class="qrbox"><div class="qr" id="qr"></div><div class="url">' + tcEsc(shortLink) + '</div></div>' +
        '<div class="count"><div class="n" id="cn">0</div><div class="c">phiếu trả lời</div></div><div class="state" id="cst"></div></div></div>';
      qr($('#qr'), 400);
    }
    const max = Math.max(1, ...c);
    stage.querySelectorAll('.opt').forEach(el => {
      const k = +el.dataset.k, pct = n ? Math.round(c[k] * 100 / n) : 0;
      el.querySelector('.fill').style.width = (c[k] / max * 100) + '%';
      el.querySelector('.v').innerHTML = c[k] + '<small>' + pct + '%</small>';
      el.classList.toggle('ok', st.reveal && k === p.dung);
    });
    stage.querySelector('.scr > div').classList.toggle('reveal', !!st.reveal && p.dung != null);
    $('#cn').textContent = n;
    $('#cst').textContent = st.open ? 'Đang mở bình chọn' : 'Đã khoá bình chọn';
    $('#giai').innerHTML = (st.reveal && p.giai) ? '<div class="giai"><b>Đáp án: ' + tcEsc(p.chon[p.dung]) + '.</b> ' + tcEsc(p.giai) + '</div>' : '';
  }

  async function push(patch) {
    Object.assign(st, patch);
    render();
    if (!F || !isTeacher) return;
    const it = SEQ[st.i];
    try {
      await R.child('state').set({ i: st.i, kind: it.kind, slide: it.slide || 0, poll: it.poll || '', open: !!st.open, reveal: !!st.reveal, t: F.now() });
    } catch (e) { msg('Không ghi được trạng thái: máy này không phải máy cô của phòng.'); }
    tcLsSet('tc_co_' + ROOM, st.i);
  }
  function go(d) {
    const i = Math.max(0, Math.min(SEQ.length - 1, st.i + d));
    if (i === st.i) return;
    push({ i, open: true, reveal: false });
  }

  $('#bPrev').onclick = () => go(-1);
  $('#bNext').onclick = () => go(1);
  $('#bOpen').onclick = () => push({ open: !st.open });
  $('#bReveal').onclick = () => push({ reveal: !st.reveal, open: st.reveal ? st.open : false });
  $('#bFull').onclick = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); };
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(1); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(-1); }
    else if (e.key === 'r' || e.key === 'R') $('#bReveal').click();
    else if (e.key === 'o' || e.key === 'O') $('#bOpen').click();
    else if (e.key === 'f' || e.key === 'F') $('#bFull').click();
  });

  $('#bCsv').onclick = () => {
    const rows = [['Mã', 'Tên bố/mẹ', 'Tên con', ...TC_POLLS.map(p => p.id + ': ' + p.hoi)]];
    const ids = new Set(Object.keys(players));
    TC_POLLS.forEach(p => Object.keys(answers[p.id] || {}).forEach(u => ids.add(u)));
    ids.forEach(u => {
      const pl = players[u] || {};
      rows.push([u.slice(0, 6), pl.name || '', pl.child || '', ...TC_POLLS.map(p => { const a = (answers[p.id] || {})[u]; return a ? p.chon[a.o] || '' : ''; })]);
    });
    rows.push([]); rows.push(['TỔNG HỢP']);
    TC_POLLS.forEach(p => { const { c, n } = tcCount(p, answers[p.id]); rows.push([p.id, p.hoi, n + ' phiếu', ...p.chon.map((t, k) => t + ': ' + c[k])]); });
    const csv = '﻿' + rows.map(r => r.map(x => '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'ket-qua-trinh-chieu-' + ROOM + '.csv'; document.body.appendChild(a); a.click(); a.remove();
  };

  st.i = Math.min(tcLsGet('tc_co_' + ROOM, 0) || 0, SEQ.length - 1);
  render();

  try {
    F = await tcInit();
    R = F.db.ref('rooms/' + ROOM);
    const teacher = (await R.child('teacher').get()).val();
    if (!teacher) { await R.child('teacher').set(F.uid); isTeacher = true; }
    else isTeacher = teacher === F.uid;
    if (!isTeacher) {
      msg('Phòng “' + ROOM + '” đang do máy khác điều khiển. Thêm ?phong=ten-moi vào link để mở phòng mới.');
    } else {
      const old = (await R.child('state').get()).val();
      if (old && typeof old.i === 'number') { st.i = Math.min(old.i, SEQ.length - 1); st.open = old.open !== false; st.reveal = !!old.reveal; }
      push({});
      toast('Đã kết nối phòng ' + ROOM);
    }
    R.child('answers').on('value', s => { answers = s.val() || {}; render(); });
    R.child('players').on('value', s => { players = s.val() || {}; render(); });
  } catch (e) {
    msg('Chưa kết nối được máy chủ. Slide vẫn chiếu được, nhưng chưa nhận câu trả lời.');
  }
})();
</script>
</body>
</html>
