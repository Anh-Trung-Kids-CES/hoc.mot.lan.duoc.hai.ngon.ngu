<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Quản trị Anh-Trung-Kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#FBF7EE; --card:#fff; --ink:#2E2418; --muted:#6F6253; --line:#E8DFCF; --soft:#F4EEE2;
  --red:#D9232B; --red-soft:#FDECEC; --amber:#9A5B00; --amber-soft:#FFF3D6; --blue:#2D5B9A; --blue-soft:#E8F0FB;
  --green:#2F7D4F; --green-soft:#E6F4EA; --focus:#F2B705; --r:14px;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --grid:#ECE6DA; --axis:#8A7E70;
  --f1:#86b6ef; --f2:#2a78d6; --f3:#104281;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#1a1a19; --card:#232321; --ink:#f0efec; --muted:#c3c2b7; --line:#3a3936; --soft:#2c2c29;
    --red:#ff5a5f; --red-soft:#3b2222; --amber:#f0b44c; --amber-soft:#3a2f1c; --blue:#8fb5ee; --blue-soft:#1f2a3a;
    --green:#6fcf97; --green-soft:#1f3327; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#33332f; --axis:#a19f95;
    --f1:#184f95; --f2:#3987e5; --f3:#86b6ef;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 80px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* đăng nhập */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate-card{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 22px;box-shadow:0 10px 40px rgba(46,36,24,.08)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.logo i{width:42px;height:42px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:15px;flex:none}
.logo b{display:block;font-size:17px}
.logo small{color:var(--muted);font-size:13px}
.gate h1{font-size:20px;margin:0 0 6px}
.gate p.lead{margin:0 0 16px;color:var(--muted);font-size:14px}
.fld{display:grid;gap:5px;margin-bottom:12px;font-size:13px;font-weight:600}
.fld input,.fld select{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;min-height:46px;width:100%;font-size:16px;font-weight:500}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;padding:8px;min-height:36px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin:4px 0 14px}
.chk input{width:20px;height:20px;accent-color:var(--red)}
.btn{border:0;background:var(--red);color:#fff;border-radius:999px;padding:12px 18px;font-weight:700;min-height:48px;width:100%;font-size:16px}
.btn:disabled{opacity:.55}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.link{border:0;background:none;color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:8px 0;font-size:14px}
.err{color:var(--red);font-weight:600;font-size:14px;margin:0 0 10px}
.ok-msg{color:var(--green);font-weight:600;font-size:14px;margin:0 0 10px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}

header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-weight:700;font-size:16px;margin-right:auto;min-width:0}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;min-height:38px;white-space:nowrap}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.12);min-width:220px;padding:6px;z-index:30}
.menu-pop .who{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:13px;color:var(--muted)}
.menu-pop .who b{display:block;color:var(--ink);font-size:14px}
.menu-pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:8px;font-weight:600;min-height:42px}
.menu-pop button:hover{background:var(--soft)}
nav{max-width:1080px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
nav button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;min-height:44px}
nav button.on{color:var(--ink);border-color:var(--red)}
nav .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;margin-left:4px}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;min-height:38px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .c{opacity:.7;margin-left:4px}
.sdt{flex:0 1 220px}
.chip.dup{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.chip.dup.on{background:var(--amber);border-color:var(--amber);color:#fff}
.newbtn{border:0;background:var(--red);color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;min-height:42px;white-space:nowrap}
.trung{background:var(--amber-soft);color:var(--amber)}
.h3row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 6px}
.h3row h3{margin:0}
.sm-act{min-height:34px;padding:5px 12px;font-size:13px}
form.sua{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.dupbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:var(--amber-soft);border:1px solid var(--amber);border-radius:var(--r);padding:10px 14px;margin:0 0 10px;font-size:14px}
.dupbar p{margin:0;flex:1 1 260px}
.act.del{border-color:var(--red);color:var(--red);background:var(--card)}
.dup-ls{display:grid;gap:6px;margin:0 0 10px}
.dup-ls button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px}
.ck{display:flex!important;grid-template-columns:none!important;align-items:center;gap:10px;font-weight:700!important}
.ck input{width:22px!important;height:22px;min-height:0!important;accent-color:var(--green)}
.search{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:42px}
select.sm{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 10px;min-height:38px;font-size:13px;font-weight:600}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.stat.warn{border-color:#F2C46B;background:var(--amber-soft)}

.list{display:flex;flex-direction:column;gap:10px}
.task{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:var(--r);padding:12px 14px}
.task.p0,.task.p1,.task.p2{border-left-color:var(--red)}
.task.p3{border-left-color:var(--amber)}
.task.p4,.task.p6{border-left-color:var(--blue)}
.t-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.t-name{font-weight:700;font-size:15px}
.t-when{font-size:13px;color:var(--muted);margin-left:auto;white-space:nowrap}
.t-when.late{color:var(--red);font-weight:700}
.t-fam{margin:4px 0 0;font-size:14px}
.t-fam button{border:0;background:none;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-align:left}
.t-meta{font-size:13px;color:var(--muted);margin-top:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.act{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);min-height:42px}
.act.pri{background:var(--red);border-color:var(--red);color:#fff}
.act.ok{background:var(--green);border-color:var(--green);color:#fff}

.badge.ht{background:#FFE3E0;color:#B8141C}
.badge.kh{background:#E3262E;color:#fff}
nav .n.ht{background:#B8141C}
.ht-buoi{display:inline-flex;gap:3px;vertical-align:middle}
.ht-buoi i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.ht-buoi i.on{background:#2A8A57}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.lan-nóng{background:var(--red-soft);color:var(--red)}
.lan-ấm{background:var(--amber-soft);color:var(--amber)}
.lan-lạnh{background:var(--blue-soft);color:var(--blue)}
.st{background:var(--soft);color:var(--ink);font-weight:600}
/* vai trò và nhóm phụ huynh (27/10/2026) */
.badge.ai-ctv{background:var(--amber-soft);color:var(--amber)}
.badge.ai-sale{background:var(--red-soft);color:var(--red)}
.badge.ai-cv{background:var(--ink);color:var(--card)}
.badge.nh{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.badge.qh{background:var(--red);color:#fff}
.bd-frame{display:block;width:100%;height:calc(100vh - 200px);min-height:560px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.phan{margin-top:22px}
.phan-h{display:flex;align-items:center;gap:8px;font-size:17px;margin:0 0 4px}
.phan-n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font-size:14px;flex:none}
.phan .box:first-of-type{margin-top:8px}
.cp-row{display:grid;grid-template-columns:minmax(110px,auto) 1fr auto;gap:6px 12px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.cp-row:last-child{border-bottom:0}
.cp-l{font-size:13px;color:var(--muted)}
.cp-v{overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.cp-a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.of-sum{margin:0;line-height:1.8}
.nv-g{margin-top:10px;padding:8px 10px;border-radius:10px}
.nv-g.now{background:var(--amber-soft)}
.nv-gt{margin:0 0 4px;font-weight:700;font-size:14px}
.nv-i{display:block;padding:6px 0;border-bottom:1px dashed var(--line)}
.nv-i:last-child{border-bottom:0}
.nv-i.xong{display:flex;gap:10px;align-items:flex-start}
.nv-i summary{display:flex;gap:10px;align-items:center;cursor:pointer;list-style:none}
.nv-i summary::-webkit-details-marker{display:none}
.nv-ck{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:var(--card);font-weight:700;color:#fff}
.nv-i.xong .nv-ck{background:var(--green);border-color:var(--green)}
.nv-f{margin:8px 0 4px 32px}
.tk-nut{padding:8px 0 4px;border-bottom:1px dashed var(--line);margin-bottom:6px}
.tk-xem summary{cursor:pointer;font-size:13px;font-weight:600;margin:2px 0 6px}
.tk-xem textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font-size:14px;line-height:1.5;color:var(--ink)}
@media (max-width:480px){.cp-row{grid-template-columns:1fr auto}.cp-l{grid-column:1/-1}}
.vai-chips{display:inline-flex;flex-wrap:wrap;gap:6px;padding-left:10px;border-left:1px solid var(--line)}
.act.xong{background:var(--green-soft);border-color:var(--green-soft);color:var(--green)}
.act.chuyen{background:var(--amber-soft);border-color:var(--amber-soft);color:var(--amber)}
.dang-ghi{font-size:13px;background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:8px 10px;margin:0 0 10px}
.vt-row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.the-ds{display:grid;gap:8px;margin:8px 0 0}
.the-ds label{font-size:13px;font-weight:600;display:grid;gap:4px}
.the-ds textarea{min-height:52px}
.the-ds .jt{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.the-tien{display:flex;gap:4px;margin:4px 0 0}
.the-tien i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.the-tien i.on{background:var(--green)}

.fam{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.fam .nm{font-weight:700}
.fam .sub{grid-column:1/-1;font-size:13px;color:var(--muted)}
.famrow{display:grid;grid-template-columns:1fr 108px 96px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.famrow .fam{border:0;border-radius:0;background:none}
.mk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:92px;padding:8px 10px;border-left:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;text-align:center;line-height:1.2}
.mk input{width:24px;height:24px;margin:0;accent-color:var(--green);cursor:pointer}
.mk.on{background:var(--green-soft);color:var(--green)}
.mk.busy{opacity:.5;pointer-events:none}
.cpk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:84px;padding:8px 10px;border:0;border-left:1px solid var(--line);background:none;font:inherit;font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;text-align:center;line-height:1.2}
.cpk .ic{font-size:20px;line-height:1}
.cpk:hover,.cpk:focus-visible{background:var(--soft)}
.cpk:disabled{color:var(--muted);cursor:default;background:none}
.cpk.warn{color:var(--muted)}
.tpl.tk-box textarea{min-height:260px}
@media (max-width:560px){ .famrow{grid-template-columns:1fr 78px 72px} .cpk,.mk{min-width:0;padding:8px 4px} }
.mk-big{display:flex;align-items:center;gap:12px;padding:12px 14px;border:2px solid var(--line);border-radius:var(--r);background:var(--card);font-weight:700;cursor:pointer;margin-top:12px}
.mk-big input{width:26px;height:26px;margin:0;accent-color:var(--green);flex:none}
.mk-big.on{border-color:var(--green);background:var(--green-soft)}
.mk-big small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.sheet{position:fixed;inset:0;z-index:50;background:rgba(20,16,10,.5);display:flex;justify-content:flex-end}
.panel{background:var(--bg);width:min(560px,100%);height:100%;overflow:auto;padding:0 16px 40px;box-shadow:-8px 0 30px rgba(0,0,0,.12)}
.panel.center{margin:auto;height:auto;max-height:92vh;border-radius:18px;width:min(460px,calc(100% - 24px));padding-bottom:20px}
.sheet.mid{justify-content:center;align-items:center}
.p-hd{position:sticky;top:0;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;z-index:2}
.p-hd h2{margin:0;font-size:18px;line-height:1.3}
.p-hd h2 small{display:block;font-size:13px;font-weight:500;color:var(--muted)}
.x{margin-left:auto;border:1px solid var(--line);background:var(--card);border-radius:999px;width:42px;height:42px;font-size:18px;flex:none}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}
.box h3{margin:0 0 4px;font-size:15px}
.box .sub{margin:0 0 12px;font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.score{display:flex;flex-direction:column;gap:3px;font-size:14px}
.score div{display:flex;gap:8px}
.score .ok{color:var(--green);font-weight:700;width:18px}
.score .no{color:var(--muted);width:18px}
.score em{margin-left:auto;font-style:normal;color:var(--muted);font-size:13px}
.tl{list-style:none;margin:0;padding:0;font-size:14px}
.tl li{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--soft)}
.tl li:last-child{border:0}
.tl time{color:var(--muted);font-size:13px;white-space:nowrap;min-width:92px}
form.log{display:grid;gap:10px}
form.log label{font-size:13px;font-weight:600;display:grid;gap:4px}
form.log select,form.log input,form.log textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;min-height:44px;width:100%}
form.log textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.save{border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:12px 18px;font-weight:700;min-height:46px}
.save:disabled{opacity:.5}
.tpl textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font-size:14px;line-height:1.5}

/* báo cáo */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>.box{margin-top:0}
.rep>.box,.rep>.grid2{margin-top:12px}
.cv{position:relative;height:260px}
.cv.tall{height:320px}
.cv.short{height:200px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:0 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend i.ln{height:3px;border-radius:2px;width:16px}
details.tbl{margin-top:10px}
details.tbl summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--blue);min-height:32px;display:flex;align-items:center}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600}
td.l,th.l{text-align:left}
.dl{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;min-height:36px}
.box-hd{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.box-hd>div{margin-right:auto}
.kid-list{list-style:none;margin:0;padding:0}
.kid-list li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--soft);font-size:14px}
.kid-list li:last-child{border:0}
.kid-list b{font-weight:600}
.kid-list span{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}

/* tài khoản */
.acc{display:grid;grid-template-columns:1fr auto;gap:4px 10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.acc .nm{font-weight:700}
.acc .sub{font-size:13px;color:var(--muted)}
.acc .acts{grid-column:1/-1;margin-top:6px}
.acc.off{opacity:.6}
.mk-tam{font:700 24px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;background:var(--soft);border-radius:12px;padding:14px;text-align:center;margin:10px 0}

/* ---------- Sổ tay ---------- */
.st-hd{margin:16px 0 6px}
.st-hd h2{font-size:21px;margin:0 0 4px}
.st-meta{color:var(--muted);font-size:13px;margin:0}
.st-meta a{color:var(--blue);font-weight:600}
.st-jump{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.st-jump .chip{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.st-sec{margin:26px 0 0}
.st-sec>h3{font-size:16px;margin:0 0 4px}
.st-sec>.hint{margin:0 0 12px}
.st-map{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.st-lbl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.st-flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:22px}
.st-flow li{position:relative;display:flex}
.st-flow li+li::before{content:"→";position:absolute;left:-17px;top:38px;color:var(--axis);font-weight:700}
.st-node{flex:1;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 10px 12px;display:flex;flex-direction:column;gap:4px;min-height:44px}
.st-node:hover{border-color:var(--red)}
.st-node .no{font-size:12px;color:var(--muted);font-weight:600}
.st-node b{font-size:14px;line-height:1.3}
.st-node small{font-size:12px;color:var(--muted);line-height:1.35}
.st-pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.st-pill{font-size:11px;font-weight:600;border-radius:999px;padding:2px 7px;background:var(--blue-soft);color:var(--blue)}
.st-loop{margin:12px 0 16px;border:1px dashed var(--axis);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted);text-align:center}
.st-loop b{color:var(--ink)}
.st-inner{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.st-inner .st-node{background:var(--red-soft);border-color:transparent}
.st-base{margin-top:12px}
.st-base .st-node{width:100%;background:var(--amber-soft);border-color:transparent;flex-direction:row;align-items:center;gap:10px;flex-wrap:wrap}
.st-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.st-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;scroll-margin-top:120px}
.st-card:has(details[open]){grid-column:1/-1}
.st-card.flash{outline:3px solid var(--focus);outline-offset:2px}
.st-ch{display:flex;gap:10px;align-items:flex-start}
.st-ic{font-size:22px;line-height:1;flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--soft)}
.st-ch .no{font-size:12px;color:var(--muted);font-weight:600}
.st-ch h4{margin:0;font-size:16px}
.st-ch p{margin:2px 0 0;color:var(--muted);font-size:13px}
.st-new{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;background:var(--green-soft);color:var(--green);vertical-align:middle}
.st-card details{margin-top:10px}
.st-card summary{cursor:pointer;font-weight:600;color:var(--blue);font-size:14px;min-height:36px;display:flex;align-items:center}
.st-body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 24px;margin-top:6px}
.st-body .full{grid-column:1/-1}
.st-body h5{margin:0 0 4px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.st-body p,.st-body li{font-size:14px;margin:0}
.st-body ol,.st-body ul{margin:0;padding-left:20px;display:grid;gap:4px}
.st-body a{color:var(--blue);font-weight:600}
.st-tpl{display:flex;flex-wrap:wrap;gap:6px}
.st-tpl span{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--soft)}
.st-search{display:flex;gap:8px;margin:0 0 10px}
.st-search input{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:44px;font-size:16px}
.st-faq{display:grid;gap:8px}
.st-q{background:var(--card);border:1px solid var(--line);border-radius:12px}
.st-q summary{cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:baseline;list-style:none;min-height:44px}
.st-q summary::-webkit-details-marker{display:none}
.st-q summary::before{content:"＋";color:var(--muted);font-weight:700;flex:none}
.st-q[open] summary::before{content:"－"}
.st-q summary b{flex:1;font-size:15px}
.st-tag{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.st-duyet{font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;background:var(--amber-soft);color:var(--amber);white-space:nowrap}
.st-a{padding:0 14px 14px 36px}
.st-a p{margin:0 0 10px;font-size:15px;white-space:pre-line}
.st-log{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.st-log li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.st-log time{font-weight:700;margin-right:6px}
.st-log .k{font-size:12px;font-weight:700;color:var(--blue);margin-right:6px}
@media (max-width:860px){
  .st-flow{grid-template-columns:1fr;gap:18px}
  .st-flow li+li::before{content:"↓";left:16px;top:-18px}
  .st-inner,.st-grid,.st-body{grid-template-columns:1fr}
  .st-chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .st-chips .chip{flex:none}
}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;font-weight:600;z-index:90;max-width:calc(100% - 32px)}
.loading{padding:60px 16px;text-align:center;color:var(--muted)}
.fatal{max-width:560px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.fatal b{display:block;font-size:17px;margin-bottom:6px}
@media (max-width:760px){ .grid2{grid-template-columns:1fr} }
@media (max-width:560px){ .two{grid-template-columns:1fr} .cv{height:230px} .cv.tall{height:300px} .stat b{font-size:22px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="gate" class="gate"><div class="gate-card"><div class="loading">Đang mở…</div></div></div>

<div id="app" hidden>
<header>
  <div class="hd">
    <div class="brand">Anh-Trung-Kids · Quản trị<small id="hanInfo"></small></div>
    <button class="ic-btn" id="reload" type="button" aria-label="Tải lại dữ liệu">↻ Tải lại</button>
    <div class="menu">
      <button class="ic-btn" id="meBtn" type="button" aria-haspopup="true" aria-expanded="false">👤 <span id="meName"></span></button>
      <div class="menu-pop" id="mePop" hidden>
        <div class="who" id="meWho"></div>
        <button type="button" id="mDoiMk">Đổi mật khẩu</button>
        <button type="button" id="mThoat">Đăng xuất</button>
      </div>
    </div>
  </div>
  <nav id="tabs" aria-label="Màn hình">
    <button type="button" data-t="viec" class="on">Việc hôm nay <span class="n" id="nViec">0</span></button>
    <button type="button" data-t="ht">Học thử <span class="n ht" id="nHt">0</span></button>
    <button type="button" data-t="gd">Gia đình</button>
    <button type="button" data-t="st">Sổ tay</button>
    <button type="button" data-t="bd">Bản đồ</button>
    <button type="button" data-t="bc" class="ql" hidden>Báo cáo</button>
    <button type="button" data-t="tk" class="ql" hidden>Tài khoản</button>
  </nav>
</header>
<main class="wrap" id="main"><div class="loading">Đang tải dữ liệu…</div></main>
</div>
<div id="sheetHost"></div>

<script>
/* Máy chủ: chính link /exec của máy chủ web học (dự án Apps Script có tệp QuanTri.gs) */
const API = "https://script.google.com/macros/s/AKfycbwsLupVsEa0jqsJ5UDtU1KciL7AiniAhYQk_YZ5N05HESfL6pmSQjcImzZ8nyH9sQ9Lsg/exec";

let D=null, ME=null, TAB='viec', FILTER={tt:'', q:'', ai:'', sdt:'', ht:'', vht:false, vai:''}, OPEN=null, busy=false, RANGE='all', TK=null, CH={};
const $=(q,el=document)=>el.querySelector(q);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>{ if(!t) return '—'; const d=new Date(t); return d.toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}); };
const num=n=>n==null?'—':Number(n).toLocaleString('vi-VN');
const pct=(a,b)=>b?Math.round(100*a/b)+'%':'—';
function ago(t){ if(!t) return ''; const m=Math.round((Date.now()-t)/60000);
  if(m<1) return 'vừa xong'; if(m<60) return m+' phút trước'; const h=Math.round(m/60); if(h<48) return h+' giờ trước'; return Math.round(h/24)+' ngày trước'; }
function until(t){ const m=Math.round((t-Date.now())/60000);
  if(m<0){ const a=-m; return {late:true, s:'quá hạn '+(a<60?a+' phút':a<2880?Math.round(a/60)+' giờ':Math.round(a/1440)+' ngày')}; }
  return {late:false, s:m<60?'còn '+m+' phút':m<1440?'trước '+new Date(t).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}):'trước '+fmt(t)}; }
function toast(t){ const el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2800); }

/* ---------- phiên đăng nhập ---------- */
const store={ get(){ try{ return sessionStorage.getItem('qt-token')||localStorage.getItem('qt-token')||''; }catch(e){ return MEM_TOKEN; } },
  set(t,nho){ MEM_TOKEN=t; try{ sessionStorage.setItem('qt-token',t); if(nho) localStorage.setItem('qt-token',t); else localStorage.removeItem('qt-token'); }catch(e){} },
  clear(){ MEM_TOKEN=''; try{ sessionStorage.removeItem('qt-token'); localStorage.removeItem('qt-token'); }catch(e){} } };
let MEM_TOKEN='', NHO=false;
async function api(fn, body){
  const payload=Object.assign({action:'qt', fn, token:store.get()}, body||{});
  let r;
  try{ r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}); }
  catch(e){ throw new Error('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.'); }
  let j; try{ j=await r.json(); }catch(e){ throw new Error('Máy chủ chưa trả lời đúng. Có thể máy chủ chưa được cập nhật bản có trang quản trị.'); }
  if(j && j.het){ store.clear(); showLogin(j.err); throw Object.assign(new Error(j.err),{silent:true}); }
  if(j && j.doiMk){ showDoiMk(true); throw Object.assign(new Error(j.err),{silent:true}); }
  if(!j || j.ok===false) throw Object.assign(new Error((j&&j.err)||'Có lỗi, thử lại sau.'),{data:j||{}});
  return j;
}

/* ---------- màn đăng nhập / thiết lập ---------- */
const LOGO=`<div class="logo"><i>ATK</i><div><b>Anh-Trung-Kids</b><small>Trang quản trị đội vận hành</small></div></div>`;
function gate(html){ $('#app').hidden=true; const g=$('#gate'); g.hidden=false; $('.gate-card',g).innerHTML=LOGO+html; }
function pwField(id,label,ac){ return `<label class="fld">${label}<span class="pw"><input id="${id}" type="password" autocomplete="${ac}" required><button type="button" data-eye="${id}">Hiện</button></span></label>`; }
function bindEyes(root){ root.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{ const i=document.getElementById(b.dataset.eye); const s=i.type==='password'; i.type=s?'text':'password'; b.textContent=s?'Ẩn':'Hiện'; }); }
function showLogin(msg){
  gate(`<h1>Đăng nhập</h1><p class="lead">Dùng tên đăng nhập và mật khẩu Quản lý cấp cho bạn.</p>
    <form id="fLogin" novalidate>
      ${msg?`<p class="err" role="alert">${esc(msg)}</p>`:''}<p class="err" id="lErr" role="alert" hidden></p>
      <label class="fld">Tên đăng nhập<input id="lU" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      ${pwField('lP','Mật khẩu','current-password')}
      <label class="chk"><input type="checkbox" id="lNho"> Giữ đăng nhập trên máy này (tối đa 6 giờ)</label>
      <button class="btn" id="lBtn" type="submit">Đăng nhập</button>
    </form>
    <p style="margin:12px 0 0;text-align:center"><button class="link" type="button" id="toSetup">Lần đầu dùng hoặc quên mật khẩu?</button></p>`);
  bindEyes($('#gate')); $('#toSetup').onclick=()=>showSetup(true);
  $('#lU').focus();
  $('#fLogin').onsubmit=async e=>{ e.preventDefault(); const er=$('#lErr'), b=$('#lBtn'); er.hidden=true;
    const u=$('#lU').value.trim(), p=$('#lP').value; if(!u||!p){ er.hidden=false; er.textContent='Nhập tên đăng nhập và mật khẩu.'; return; }
    b.disabled=true; b.textContent='Đang kiểm tra…';
    try{ const j=await api('dangNhap',{user:u, mk:p}); NHO=$('#lNho').checked; vao(j); }
    catch(x){ if(!x.silent){ er.hidden=false; er.textContent=x.message; } b.disabled=false; b.textContent='Đăng nhập'; } };
}
function showSetup(coTk){
  gate(`<h1>${coTk?'Tạo tài khoản Quản lý / đặt lại mật khẩu':'Tạo tài khoản Quản lý đầu tiên'}</h1>
    <p class="lead">Mở Sheet <b>Anh-Trung-Kids – Dữ liệu dự án</b> (tài khoản anhtrung.home), tab <b>Cài đặt quản trị</b>, chép ô <b>Mã thiết lập tài khoản</b>. Mã chỉ dùng được một lần.${coTk?' Nhập tên đăng nhập đã có để đặt lại mật khẩu, hoặc tên mới để tạo thêm một Quản lý.':''}</p>
    <form id="fSet" novalidate><p class="err" id="sErr" role="alert" hidden></p>
      <label class="fld">Mã thiết lập<input id="sMa" autocomplete="off" autocapitalize="characters" spellcheck="false" required></label>
      <label class="fld">Tên đăng nhập<input id="sU" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="ví dụ: duyen" required></label>
      <label class="fld">Tên hiển thị<input id="sT" autocomplete="name" placeholder="ví dụ: Cô Duyên"></label>
      ${pwField('sP','Mật khẩu mới (ít nhất 8 ký tự, có chữ và số)','new-password')}
      ${pwField('sP2','Nhập lại mật khẩu','new-password')}
      <button class="btn" id="sBtn" type="submit">Lưu và vào trang</button>
    </form>
    ${coTk?`<p style="margin:12px 0 0;text-align:center"><button class="link" type="button" id="toLogin">← Quay lại đăng nhập</button></p>`:''}`);
  bindEyes($('#gate')); if(coTk) $('#toLogin').onclick=()=>showLogin();
  $('#sMa').focus();
  $('#fSet').onsubmit=async e=>{ e.preventDefault(); const er=$('#sErr'), b=$('#sBtn'); er.hidden=true;
    const say=t=>{ er.hidden=false; er.textContent=t; };
    const p=$('#sP').value; if(p!==$('#sP2').value) return say('Hai lần nhập mật khẩu chưa giống nhau.');
    b.disabled=true; b.textContent='Đang lưu…';
    try{ const j=await api('thietLap',{ma:$('#sMa').value.trim(), user:$('#sU').value.trim(), ten:$('#sT').value.trim(), mk:p}); vao(j); toast('Đã lưu mật khẩu. Mã thiết lập cũ đã hết hiệu lực.'); }
    catch(x){ if(!x.silent) say(x.message); b.disabled=false; b.textContent='Lưu và vào trang'; } };
}
function showDoiMk(batBuoc){
  const html=`<h1>${batBuoc?'Đặt mật khẩu của bạn':'Đổi mật khẩu'}</h1>
    <p class="lead">${batBuoc?'Bạn đang dùng mật khẩu tạm do Quản lý cấp. Đặt mật khẩu riêng để tiếp tục.':'Sau khi đổi, các máy khác đang đăng nhập tài khoản này sẽ phải đăng nhập lại.'}</p>
    <form id="fMk" novalidate><p class="err" id="mErr" role="alert" hidden></p>
      ${pwField('mC',batBuoc?'Mật khẩu tạm':'Mật khẩu hiện tại','current-password')}
      ${pwField('mN','Mật khẩu mới (ít nhất 8 ký tự, có chữ và số)','new-password')}
      ${pwField('mN2','Nhập lại mật khẩu mới','new-password')}
      <button class="btn" id="mBtn" type="submit">Lưu mật khẩu</button>
      ${batBuoc?'':'<button class="btn ghost" id="mHuy" type="button" style="margin-top:8px">Huỷ</button>'}
    </form>`;
  let root;
  if(batBuoc){ gate(html); root=$('#gate'); }
  else { const host=$('#sheetHost'); host.innerHTML=`<div class="sheet mid" role="dialog" aria-modal="true" aria-label="Đổi mật khẩu"><div class="panel center"><div style="padding-top:16px">${html}</div></div></div>`; root=host; $('#mHuy').onclick=()=>host.innerHTML=''; }
  bindEyes(root); $('#mC',root).focus();
  $('#fMk',root).onsubmit=async e=>{ e.preventDefault(); const er=$('#mErr',root), b=$('#mBtn',root); er.hidden=true; const say=t=>{ er.hidden=false; er.textContent=t; };
    if($('#mN',root).value!==$('#mN2',root).value) return say('Hai lần nhập mật khẩu mới chưa giống nhau.');
    b.disabled=true; b.textContent='Đang lưu…';
    try{ const j=await api('doiMatKhau',{mkCu:$('#mC',root).value, mkMoi:$('#mN',root).value}); $('#sheetHost').innerHTML=''; vao(j); toast('Đã đổi mật khẩu'); }
    catch(x){ if(!x.silent) say(x.message); b.disabled=false; b.textContent='Lưu mật khẩu'; } };
}
function vao(j){ store.set(j.token, NHO || !!localStorageHas()); ME=j.me; if(ME.doiMk) return showDoiMk(true); $('#gate').hidden=true; $('#app').hidden=false; load(); }
function localStorageHas(){ try{ return !!localStorage.getItem('qt-token'); }catch(e){ return false; } }
async function batDau(){
  if(store.get()){ $('#gate').hidden=true; $('#app').hidden=false; load(); return; }
  try{ const j=await api('trangThai'); if(j.coTaiKhoan) showLogin(); else showSetup(false); }
  catch(x){ if(!x.silent) gate(`<h1>Chưa kết nối được máy chủ</h1><p class="lead">${esc(x.message)}</p><button class="btn" type="button" onclick="batDau()">Thử lại</button>`); }
}

/* ---------- dữ liệu ---------- */
async function load(){
  if(busy) return; busy=true; $('#reload').disabled=true;
  try{ const d=await api('taiDuLieu'); D=d; ME=d.me; boot(); }
  catch(e){ if(!e.silent) $('#main').innerHTML=`<div class="fatal"><b>Chưa tải được dữ liệu</b>${esc(e.message)}<p class="hint">Bấm Tải lại để thử lần nữa.</p></div>`; }
  finally{ busy=false; $('#reload').disabled=false; }
}
function boot(){
  $('#meName').textContent=D.me.ten||D.me.user;
  $('#meWho').innerHTML=`<b>${esc(D.me.ten)}</b>${esc(D.me.user)} · ${esc(D.me.vaiTro)}`;
  const h=D.caiDat.han, hr=Math.round((h-Date.now())/3600e3);
  $('#hanInfo').textContent=h ? (hr>0?`Hạn đăng ký ${D.caiDat.hanText} · còn ${hr} giờ`:`Khai mạc ${D.caiDat.khaiMac}`) : '';
  document.querySelectorAll('#tabs .ql').forEach(b=>b.hidden=!D.laQL);
  if(!D.laQL && (TAB==='bc'||TAB==='tk')) TAB='viec';
  if(D.cap==='cv' && !FILTER.vtDat){ FILTER.vai='cv'; FILTER.vtDat=1; }
  render();
  if(OPEN){ const f=fam(OPEN); if(f) openFam(f.code,true); else closeFam(); }
}
const fam=code=>D.gd.find(f=>f.code===code);
/* ---------- vai trò (27/10/2026): CTV · Sale · Cố vấn · Quản lý ----------
   Máy chủ cũ chưa gửi D.cap: trang chạy như trước (Quản lý thấy cả đội, Vận hành thấy gia đình của mình). */
const VT_TEN={ctv:'CTV',sale:'Sale',cv:'Cố vấn',ql:'Quản lý'};
const CAP=()=>D&&(D.cap||(D.laQL?'ql':'sale'));
const XEM_HET=()=>D&&(D.xemHet||D.laQL);
const MOT_NGAY=864e5;
const qua24=v=>v.han<Date.now()-MOT_NGAY;
const homNay=t=>t&&new Date(t).toDateString()===new Date().toDateString();
/* Việc hôm nay: gia đình đã mở khóa 21 ngày chỉ còn các việc theo bản đồ điểm chạm (g21) do máy chủ sinh. */
function locViec(){ if(!D||!D.gd) return; D.gd.forEach(f=>{ f.viec=(f.viec||[]).filter(v=>v.loai!=='link' && (!f.moKhoa || v.g21)); }); }
function hopNguoi(x){ const a=FILTER.ai, f=x.f;
  if(!a) return true;
  if(a==='(chưa giao)') return !f.nguoiHoTro;
  return f.nguoiHoTro===a; }
/* Hàng việc theo vai trò (Quản lý, Cố vấn chọn bằng nút cạnh "Chỉ học thử") */
function hopVai(v, vai){ if(!vai) return true; if(vai==='cv') return v.ai==='cv' || qua24(v); return v.ai===vai; }
const tatCaViec=()=>{ const out=[]; D.gd.forEach(f=>f.viec.forEach(v=>out.push({v,f}))); return out
  .filter(x=>!FILTER.vht || x.f.hocThu)
  .filter(x=>!D.cap || XEM_HET() || !x.v.ai || x.v.ai===CAP())
  .filter(hopNguoi); };
const tasks=()=>tatCaViec().filter(x=>hopVai(x.v, FILTER.vai))
  .sort((a,b)=>a.v.uuTien-b.v.uuTien || a.v.han-b.v.han);

function render(){
  locViec();
  document.querySelectorAll('#tabs button').forEach(b=>{ b.classList.toggle('on',b.dataset.t===TAB); b.setAttribute('aria-current',b.dataset.t===TAB?'page':'false'); });
  $('#nViec').textContent=D.gd.reduce((a,f)=>a+f.viec.length,0);
  $('#nHt').textContent=D.gd.filter(f=>f.hocThu).length;
  Object.values(CH).forEach(c=>c.destroy()); CH={};
  if(TAB==='viec') rViec(); else if(TAB==='ht') rHt(); else if(TAB==='gd') rGd(); else if(TAB==='st') rSt(); else if(TAB==='bd') rBd(); else if(TAB==='bc') rBc(); else rTk();
}
function aiPicker(){ if(!XEM_HET()) return '';
  const names=[...new Set(D.gd.map(f=>f.nguoiHoTro||'(chưa giao)'))].sort();
  const o=(v,t)=>`<option value="${esc(v)}" ${FILTER.ai===v?'selected':''}>${esc(t)}</option>`;
  return `<select class="sm" id="aiSel" aria-label="Lọc theo người phụ trách"><option value="">Cả đội</option>${names.map(n=>o(n,n)).join('')}</select>`; }
function vaiChips(){ if(!D.cap || !XEM_HET()) return '';
  const all=tatCaViec(), dem=k=>all.filter(x=>hopVai(x.v,k)).length;
  return `<span class="vai-chips" role="group" aria-label="Chọn hàng việc theo vai trò">${[['','Tất cả'],['ctv','Việc CTV'],['sale','Việc Sale'],['cv','Cần cố vấn']].map(([k,t])=>
    `<button class="chip ${FILTER.vai===k?'on':''}" type="button" data-vai="${k}" aria-pressed="${FILTER.vai===k}">${t}<span class="c">${dem(k)}</span></button>`).join('')}</span>`; }
function bindAi(){ const s=$('#aiSel'); if(s) s.onchange=()=>{ FILTER.ai=s.value; render(); }; }
function lanBadge(f){ if(!['Đang dùng thử','Mời đăng ký'].includes(f.trangThai)) return '';
  return `<span class="badge lan-${f.lan}" title="Điểm gia đình">${f.lan} · ${f.diem}</span>`; }
const NHOM_TEN={A:'Tích cực',B:'Học đều',C:'Tụt nhịp',D:'Học thử',E:'Nuôi dưỡng'};
function nhomBadge(f){ return f.nhom?`<span class="badge nh" title="Nhóm ${f.nhom}: ${NHOM_TEN[f.nhom]||''}">${f.nhom} · ${NHOM_TEN[f.nhom]||''}</span>`:''; }
function aiBadge(v){ return v.ai&&XEM_HET()?`<span class="badge ai-${v.ai}">${VT_TEN[v.ai]||v.ai}</span>`:''; }
function famLine(f){ return `${esc(f.phuHuynh||'(chưa có tên)')} – bé ${esc(f.tenCon||'?')}${f.tuoi?`, ${esc(f.tuoi)} tuổi`:''}${f.khoa?` · ${esc(f.khoa)}`:''}`; }
function callBtns(f, tin, viec){
  const p=f.zalo&&/^0\d{9,10}$/.test(f.zalo)?f.zalo:'', so=String(f.zalo||'').replace(/[^\d+]/g,''), ctv=CAP()==='ctv';
  return `${p&&!ctv?`<a class="act pri" href="tel:${p}">📞 Gọi</a>`:''}${p?`<a class="act" href="https://zalo.me/${p}" target="_blank" rel="noopener">💬 Zalo</a>`:''}
    ${so?`<button class="act" type="button" data-sdt="${esc(so)}" title="Chép số ${esc(so)}" aria-label="Chép số điện thoại ${esc(so)}">📄 Chép SĐT</button>`:''}
    ${tin?`<button class="act" type="button" data-tin="${tin}" data-code="${esc(f.code)}"${viec?` data-viec="${esc(viec)}"`:''}>📋 Tin mẫu</button>`:''}
    <button class="act" type="button" data-open="${esc(f.code)}"${viec?` data-viec="${esc(viec)}"`:''}>✍️ Ghi kết quả</button>`; }

/* ---------- Việc hôm nay ---------- */
function oSo(b,t,warn){ return `<div class="stat ${warn?'warn':''}"><b>${b}</b><span>${t}</span></div>`; }
function tomTat(T){
  const now=Date.now(), late=T.filter(x=>x.v.han<now).length, cap=CAP();
  const toi=c=>c.ai===D.me.ten;
  if(cap==='ctv'){
    const xong=D.gd.reduce((a,f)=>a+f.lienHe.filter(c=>toi(c)&&homNay(c.t)&&c.kq!=='Chuyển sale').length,0);
    const chuyen=D.gd.reduce((a,f)=>a+f.lienHe.filter(c=>toi(c)&&homNay(c.t)&&c.kq==='Chuyển sale').length,0);
    return oSo(T.length,`việc trong ca${late?` · ${late} quá hạn`:''}`,late)+oSo(xong,'đã xong hôm nay')+oSo(chuyen,'đã chuyển sale hôm nay');
  }
  const thu=D.gd.filter(f=>['Đang dùng thử','Mời đăng ký'].includes(f.trangThai));
  const cho=D.gd.filter(f=>f.trangThai==='Chờ đóng phí').length;
  let h=oSo(T.length,`việc cần làm${late?` · ${late} quá hạn`:''}`,late);
  if(cap==='sale' && D.cap){
    const hoc=D.gd.filter(f=>f.moKhoa), du=hoc.filter(f=>f.theDu>=6).length, hen=D.gd.filter(f=>f.henGoiLai&&f.henGoiLai>now).length;
    return h+oSo(D.gd.filter(f=>f.nhom==='A').length,'gia đình nhóm A (tích cực)')+oSo(`${du} / ${hoc.length}`,'thẻ đủ 6 ô (đang học 21 ngày)')+oSo(hen,'lịch hẹn sắp tới');
  }
  h+=oSo(`${thu.filter(f=>f.lan==='nóng').length} / ${thu.filter(f=>f.lan==='ấm').length} / ${thu.filter(f=>f.lan==='lạnh').length}`,'đang thử: nóng / ấm / lạnh')+oSo(cho,'đã đăng ký, chờ đóng phí');
  if(XEM_HET()){
    const chuaGiao=D.bc?D.bc.chuaGiao:D.gd.filter(f=>!f.nguoiHoTro&&!['Dừng','Học viên khóa dài'].includes(f.trangThai)).length;
    if(D.cap){ const all=[]; D.gd.forEach(f=>f.viec.forEach(v=>all.push(v)));
      h+=oSo(all.filter(v=>v.loai==='xin').length,'chờ cố vấn cho ý kiến',all.some(v=>v.loai==='xin'))+oSo(all.filter(qua24).length,'việc quá hạn hơn 24 giờ',all.some(qua24)); }
    h+=oSo(chuaGiao,'gia đình chưa giao người',chuaGiao);
  }
  return h;
}
function rViec(){
  const T=tasks(), ctv=CAP()==='ctv';
  $('#main').innerHTML=`
    <div class="summary">${tomTat(T)}</div>
    <div class="bar">${aiPicker()}<button class="chip ${FILTER.vht?'on':''}" id="vht" type="button" aria-pressed="${FILTER.vht}">🎁 Chỉ học thử<span class="c">${D.gd.reduce((a,f)=>a+(f.hocThu?f.viec.length:0),0)}</span></button>${vaiChips()}</div>
    ${FILTER.vai==='ctv'&&XEM_HET()?'<p class="hint">Đây là hàng việc của CTV: nhắn theo tin mẫu, không gọi tư vấn, không nói giá. CTV đăng nhập bằng tài khoản riêng sẽ chỉ thấy hàng này.</p>':''}
    ${ctv?'<p class="hint">Hàng việc CTV: nhắn theo tin mẫu, gửi xong bấm "Đã gửi tin". Ba mẹ hỏi giá, lịch học, muốn học tiếp hoặc phàn nàn: bấm "Chuyển sale" và ghi rõ ba mẹ nói gì.</p>':''}
    <div class="list">${T.length?T.map(({v,f})=>{ const u=until(v.han);
      return `<article class="task p${v.uuTien}">
        <div class="t-top"><span class="t-name">${esc(v.ten)}</span>${aiBadge(v)}${qua24(v)&&XEM_HET()?'<span class="badge qh">Quá hạn hơn 24 giờ</span>':''}${f.hocThu?'<span class="badge ht">Học thử</span>':''}${nhomBadge(f)}${lanBadge(f)}<span class="t-when ${u.late?'late':''}">${v.dem?(v.demTen||'để lại số')+' '+ago(v.dem)+' · ':''}${u.s}</span></div>
        <p class="t-fam"><button type="button" data-open="${esc(f.code)}">${famLine(f)}</button></p>
        <div class="t-meta">${f.hoc?`Học thử ${f.hoc.soBuoi}/3 buổi · nói ${f.hoc.noi} lần · `:''}${f.h21?`21 ngày: ${f.h21.buoi} buổi, lần cuối ${ago(f.h21.cuoi)} · `:''}${esc(f.trangThai)}${XEM_HET()?` · ${esc(f.nguoiHoTro||'chưa giao')}`:''}${f.lienHeGanNhat?` · liên hệ ${ago(f.lienHeGanNhat)}`:''}</div>
        <div class="acts">${v.loai==='mo'?`<button class="act ok" type="button" data-mkgo="${esc(f.code)}">✓ Mở khóa 21 ngày</button>`:''}${v.ai==='ctv'&&v.tin&&v.loai!=='mo'?`<button class="act xong" type="button" data-xong="${esc(f.code)}" data-viec="${esc(v.loai)}">✓ Đã gửi tin</button>`:''}${callBtns(f, v.tin, v.loai)}${ctv?`<button class="act chuyen" type="button" data-chuyen="${esc(f.code)}" data-viec="${esc(v.loai)}">↗ Chuyển sale</button>`:''}</div></article>`; }).join('')
      :`<div class="empty"><b>Không còn việc nào 🎉</b>${ctv?'Việc mới của ca sẽ hiện ở đây.':'Gia đình mới để lại Zalo sẽ hiện ở đây.'} Trang tự tải lại mỗi 2 phút.</div>`}</div>`;
  const vh=$('#vht'); if(vh) vh.onclick=()=>{ FILTER.vht=!FILTER.vht; rViec(); };
  document.querySelectorAll('[data-vai]').forEach(b=>b.onclick=()=>{ FILTER.vai=b.dataset.vai; rViec(); });
  bindAi(); bindActs($('#main'));
}
async function daGui(code, viec, btn){
  btn.disabled=true; btn.textContent='Đang lưu…';
  try{ D=await api('ghiLienHe',{p:{code, ketQua:'Đã nhắn Zalo', viec, ghiChu:'Đã gửi tin mẫu'}}); toast('Đã ghi: đã gửi tin'); render(); }
  catch(e){ btn.disabled=false; btn.textContent='✓ Đã gửi tin'; if(!e.silent) toast(e.message); }
}

/* ---------- Học thử: danh sách riêng các gia đình đăng ký ở ô "Học thử miễn phí" (tab "Đăng ký học thử") ---------- */
const htBuoi=f=>f.hoc?f.hoc.soBuoi:0, htBam=f=>!!(f.hoc&&f.hoc.tKichHoat);
const HT_LOC=[['','Tất cả',()=>true],['chua','Chưa vào học',f=>!htBuoi(f)&&!f.moKhoa],['dang','Đang học (1 buổi)',f=>htBuoi(f)===1&&!htBam(f)&&!f.moKhoa],
  ['xong2','Xong buổi 2, chưa bấm kích hoạt',f=>htBuoi(f)>=2&&!htBam(f)&&!f.moKhoa],['kh','Đã bấm kích hoạt, chờ mở',f=>htBam(f)&&!f.moKhoa],['mo','✓ Đã mở khóa',f=>f.moKhoa]];
function rHt(){
  const A=D.gd.filter(f=>f.hocThu), hn=new Date().toDateString(), q=FILTER.q.trim().toLowerCase();
  const loc=(HT_LOC.find(x=>x[0]===FILTER.ht)||HT_LOC[0])[2];
  const L=A.filter(f=>loc(f) && (!FILTER.ai || (FILTER.ai==='(chưa giao)'?!f.nguoiHoTro:f.nguoiHoTro===FILTER.ai))
      && khopSdt(f,FILTER.sdt) && (!q || [f.phuHuynh,f.tenCon,f.zalo,f.code,f.ref].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>b.hocThu.t-a.hocThu.t);
  const n=fn=>A.filter(fn).length, pct=k=>A.length?Math.round(100*k/A.length)+'%':'—';
  const vao=n(f=>htBuoi(f)>=1), x2=n(f=>htBuoi(f)>=2), bam=n(htBam), mo=n(f=>f.moKhoa);
  $('#main').innerHTML=`
    <div class="summary">
      <div class="stat"><b>${A.length}</b><span>đăng ký học thử · hôm nay ${n(f=>new Date(f.hocThu.t).toDateString()===hn)}</span></div>
      <div class="stat"><b>${vao}</b><span>đã vào học (${pct(vao)})</span></div>
      <div class="stat"><b>${x2}</b><span>xong buổi 2 (${pct(x2)})</span></div>
      <div class="stat ${bam-n(f=>htBam(f)&&f.moKhoa)?'warn':''}"><b>${bam}</b><span>bấm kích hoạt · ${bam-n(f=>htBam(f)&&f.moKhoa)} chờ mở</span></div>
      <div class="stat"><b>${mo}</b><span>đã mở khóa 21 ngày (${pct(mo)})</span></div>
    </div>
    <div class="bar"><input class="search" id="q" type="search" placeholder="Tìm tên con, mã" value="${esc(FILTER.q)}" aria-label="Tìm gia đình học thử">
      <input class="search sdt" id="qs" type="search" inputmode="tel" placeholder="Lọc theo SĐT" value="${esc(FILTER.sdt)}" aria-label="Lọc theo số điện thoại">${aiPicker()}
      <button class="newbtn" type="button" id="htCsv">⬇ Tải danh sách (CSV)</button></div>
    <div class="bar" role="group" aria-label="Lọc theo tiến độ học thử">${HT_LOC.map(([k,t,fn])=>`<button class="chip ${FILTER.ht===k?'on':''}" data-ht="${k}" type="button">${t}<span class="c">${n(fn)}</span></button>`).join('')}</div>
    <div class="list">${L.length?L.map(f=>{ const b=htBuoi(f);
      return `<div class="famrow"><button class="fam" type="button" data-open="${esc(f.code)}">
        <span class="nm">Bé ${esc(f.tenCon||'?')}${f.tuoi?`, ${esc(f.tuoi)} tuổi`:''}${f.khoa?` · ${esc(f.khoa)}`:''}</span>${htBam(f)&&!f.moKhoa?'<span class="badge kh">Đã bấm kích hoạt</span>':''}
        <span class="sub">Đăng ký ${ago(f.hocThu.t)} · ${esc(f.zalo||'chưa có số')} · <span class="ht-buoi" title="Đã học ${b}/3 buổi">${[1,2,3].map(i=>`<i class="${b>=i?'on':''}"></i>`).join('')}</span> ${b}/3 buổi${f.hoc&&f.hoc.noi?` · nói ${f.hoc.noi} lần`:''} · ${f.dyTuVan?'✓ tư vấn':'✗ tư vấn'} · ${esc(f.ref)}${XEM_HET()?` · ${esc(f.nguoiHoTro||'chưa giao')}`:''}${f.viec.length?` · <b>${f.viec.length} việc</b>`:''}</span></button>
        ${mkBox(f)}${cpkBtn(f)}</div>`; }).join('')
      :`<div class="empty"><b>Chưa có gia đình nào ở đây</b>Ba mẹ đăng ký ở ô "Học thử miễn phí" trên web học sẽ hiện ở đây.</div>`}</div>`;
  const qi=$('#q'); qi.oninput=()=>{ FILTER.q=qi.value; const pos=qi.selectionStart; rHt(); const m=$('#q'); m.focus(); m.setSelectionRange(pos,pos); };
  const qs=$('#qs'); qs.oninput=()=>{ FILTER.sdt=qs.value; const pos=qs.selectionStart; rHt(); const m=$('#qs'); m.focus(); try{ m.setSelectionRange(pos,pos); }catch(e){} };
  document.querySelectorAll('[data-ht]').forEach(b=>b.onclick=()=>{ FILTER.ht=b.dataset.ht; rHt(); });
  $('#htCsv').onclick=()=>csv('dang-ky-hoc-thu', ['Đăng ký lúc','Mã gia đình','Tên con','Tuổi','SĐT / Zalo','Khoá','Số buổi đã học','Bấm kích hoạt','Mở khóa 21 ngày','Đồng ý tư vấn','Trạng thái','Người hỗ trợ','Mã CTV'],
    L.map(f=>[fmt(f.hocThu.t), f.code, f.tenCon, f.tuoi, f.zalo, f.khoa, htBuoi(f), htBam(f)?fmt(f.hoc.tKichHoat):'', f.moKhoa?'Có':'', f.dyTuVan?'Có':'', f.trangThai, f.nguoiHoTro, f.ref]));
  bindAi(); bindActs($('#main'));
}

/* ---------- Gia đình ---------- */
/* Khóa số điện thoại giống máy chủ: bỏ +84/84 và số 0 đầu, để "83644365" và "0083644365" là một */
function keySo(v){ const t=String(v==null?'':v).trim().toLowerCase(); if(t.includes('@')) return t;
  let d=t.replace(/\D/g,''); if(/^84\d{9,10}$/.test(d)) d=d.slice(2); d=d.replace(/^0+/,''); return d.length>=8?d:''; }
function nhomTrung(){ const m={}; D.gd.forEach(f=>{ const k=keySo(f.zalo); if(k) (m[k]=m[k]||[]).push(f); });
  const out={}; Object.keys(m).forEach(k=>{ if(m[k].length>1) out[k]=m[k]; }); return out; }
function khopSdt(f,q){ const t=String(q||'').trim().toLowerCase(); if(!t) return true;
  if(/[a-z@]/.test(t)) return String(f.zalo||'').toLowerCase().includes(t);
  let d=t.replace(/\D/g,''); if(/^84\d{8,}/.test(d)) d=d.slice(2); d=d.replace(/^0+/,''); if(!d) return true;
  return String(f.zalo||'').replace(/\D/g,'').replace(/^0+/,'').includes(d); }
function rGd(){
  const counts={}; D.gd.forEach(f=>counts[f.trangThai]=(counts[f.trangThai]||0)+1);
  const q=FILTER.q.trim().toLowerCase();
  const chuaMo=f=>['Chờ đóng phí','Đang học 21 ngày'].includes(f.trangThai)&&!f.moKhoa;
  const NT=nhomTrung(), laTrung=f=>!!NT[keySo(f.zalo)], soTrung=Object.values(NT).reduce((n,g)=>n+g.length,0);
  if(FILTER.tt==='__trung' && !soTrung) FILTER.tt='';
  const L=D.gd.filter(f=>(!FILTER.tt||(FILTER.tt==='__mk'?chuaMo(f):FILTER.tt==='__mo'?f.moKhoa:FILTER.tt==='__trung'?laTrung(f):f.trangThai===FILTER.tt)) && (!FILTER.ai || (FILTER.ai==='(chưa giao)'?!f.nguoiHoTro:f.nguoiHoTro===FILTER.ai))
      && khopSdt(f,FILTER.sdt) && (!q || [f.phuHuynh,f.tenCon,f.zalo,f.code,f.ref].join(' ').toLowerCase().includes(q)))
    .sort(FILTER.tt==='__trung' ? (a,b)=>keySo(a.zalo).localeCompare(keySo(b.zalo)) || (b.moKhoa-a.moKhoa) || (a.taoLuc-b.taoLuc)
      : (a,b)=>b.diem-a.diem || (b.taoLuc-a.taoLuc));
  const soNhom=Object.keys(NT).length;
  $('#main').innerHTML=`
    <div class="bar"><input class="search" id="q" type="search" placeholder="Tìm tên ba mẹ, tên con, mã" value="${esc(FILTER.q)}" aria-label="Tìm gia đình">
      <input class="search sdt" id="qs" type="search" inputmode="tel" placeholder="Lọc theo SĐT" value="${esc(FILTER.sdt)}" aria-label="Lọc theo số điện thoại">${aiPicker()}
      <button class="newbtn" type="button" id="taoTk">＋ Tạo tài khoản</button></div>
    <div class="bar" role="group" aria-label="Lọc theo trạng thái">
      <button class="chip ${!FILTER.tt?'on':''}" data-tt="" type="button">Tất cả<span class="c">${D.gd.length}</span></button>
      <button class="chip ${FILTER.tt==='__mo'?'on':''}" data-tt="__mo" type="button">✓ Đã mở khóa<span class="c">${D.gd.filter(f=>f.moKhoa).length}</span></button>
      <button class="chip ${FILTER.tt==='__mk'?'on':''}" data-tt="__mk" type="button">Chưa mở khóa<span class="c">${D.gd.filter(chuaMo).length}</span></button>

const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function legend(items){ return `<div class="legend" aria-hidden="true">${items.map(([n,c,ln])=>`<span><i class="${ln?'ln':''}" style="background:${c}"></i>${esc(n)}</span>`).join('')}</div>`; }
function tblHtml(head, rows){ return `<div class="tbl-wrap"><table><thead><tr>${head.map((h,i)=>`<th class="${i?'':'l'}">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i?'':'l'}">${typeof c==='number'?num(c):esc(c)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${head.length}">Chưa có dữ liệu</td></tr>`}</tbody></table></div>`; }
function asTable(head, rows){ return `<details class="tbl"><summary>Xem dạng bảng</summary>${tblHtml(head, rows)}</details>`; }
function csv(name, head, rows){
  const s=[head].concat(rows).map(r=>r.map(c=>{ c=String(c==null?'':c); return /[",\n;]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv;charset=utf-8'})); a.download=name+'.csv'; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}
function baseOpts(o){
  const ink=css('--ink'), muted=css('--axis'), grid=css('--grid');
  Chart.defaults.font.family="'Be Vietnam Pro',system-ui,sans-serif"; Chart.defaults.color=muted;
  return Object.assign({ responsive:true, maintainAspectRatio:false, animation:false,
    interaction:{mode:'index', intersect:false},
    plugins:{ legend:{display:false},
      tooltip:{ backgroundColor:css('--card'), titleColor:ink, bodyColor:ink, borderColor:css('--line'), borderWidth:1, padding:10, boxPadding:4, usePointStyle:true,
        callbacks:{ label:c=>` ${c.dataset.label}: ${num(c.parsed[o&&o.indexAxis==='y'?'x':'y'])}` } } },
    scales:{ x:{ grid:{display:false}, border:{color:grid}, ticks:{color:muted, maxRotation:0, autoSkip:true, autoSkipPadding:10} },
             y:{ beginAtZero:true, grid:{color:grid}, border:{display:false}, ticks:{color:muted, precision:0} } } }, o||{});
}
const barDs=(label,data,color)=>({label,data,backgroundColor:color,borderRadius:{topLeft:4,topRight:4},borderSkipped:'start',maxBarThickness:28,categoryPercentage:.72,barPercentage:.9});
const hbarDs=(label,data,color)=>({label,data,backgroundColor:color,borderRadius:{topRight:4,bottomRight:4},borderSkipped:'start',maxBarThickness:22});
const lineDs=(label,data,color)=>({label,data,borderColor:color,backgroundColor:color,borderWidth:2,pointRadius:3,pointHoverRadius:5,pointBorderColor:css('--card'),pointBorderWidth:2,tension:0});
function chart(id,cfg){ const el=document.getElementById(id); if(!el||!window.Chart) return; CH[id]=new Chart(el,cfg); }
const dm=s=>{ const [y,m,d]=s.split('-'); return d+'/'+m; };

async function tkLuu(tk, btn, er){

function bindSua(f, host){
  const fm=$('#suaF',host), bt=$('#suaBtn',host), kv=$('#gdBox .kv',host); if(!fm||!bt) return;
  const mo=on=>{ fm.hidden=!on; kv.hidden=on; bt.hidden=on; if(on) $('#sPh',host).focus(); };

      tuoi:$('#sTuoi',host).value, khoa:$('#sKh',host).value, ref:$('#sRef',host).value.trim()};
    if(!p.tenCon) return say('Tên con không được để trống.');

    const k=keySo(p.zalo), c=D.gd.find(x=>x.code!==f.code&&keySo(x.zalo)===k);
    if(c) return say(`Số này đang là của <b>${famLine(c)}</b>. Nếu là cùng một gia đình, hãy mở dòng đó và dùng Xoá dòng trùng để gộp.`);
    if(keySo(p.zalo)!==keySo(f.zalo) && !confirm(`Đổi số đăng nhập từ ${f.zalo||'(trống)'} sang ${p.zalo}?\nBa mẹ sẽ đăng nhập bằng số mới.`)) return;
    const b=$('#sOk',host); b.disabled=true; b.textContent='Đang lưu…';
    try{ const d=await api('suaGd',{code:f.code,p}); D=d; toast(d.soSua?'Đã lưu '+d.soSua+' thay đổi. Giá trị cũ ở tab Lịch sử sửa.':'Không có gì thay đổi'); openFam(f.code,true); render(); }
    catch(x){ b.disabled=false; b.textContent='Lưu thay đổi'; if(x.silent) return;
      say(/Không rõ yêu cầu/.test(x.message)?'Máy chủ chưa được cập nhật bản có Sửa thông tin. Báo Quản lý cập nhật Apps Script.':esc(x.message)); } };
}

async function copyText(txt, msg){ try{ await navigator.clipboard.writeText(txt); toast(msg); }
  catch(e){ const t=document.createElement('textarea'); t.value=txt; t.setAttribute('readonly',''); t.style.cssText='position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(t); t.select(); t.setSelectionRange(0,txt.length);
    try{ document.execCommand('copy'); toast(msg); }catch(_){ toast('Số: '+txt); } t.remove(); } }
async function copy(ta){ try{ await navigator.clipboard.writeText(ta.value); toast('Đã chép'); }

async function save(f){
  const host=$('#sheetHost'), err=$('#lerr',host), g=q=>$(q,host);
  const p={code:f.code, ketQua:g('#kq').value, ghiChu:g('#gc').value.trim(), trangThai:g('#tt').value!==f.trangThai?g('#tt').value:'',
    lyDo:g('#ld').value, lyDoThem:g('#ld2').value.trim(), khoa:g('#kh').value};

  const say=t=>{ err.hidden=false; err.textContent=t; };
  if(!p.ketQua && !p.ghiChu && !p.trangThai && !p.henGoiLai && !p.khoa && p.nguoiHoTro==null) return say('Chọn kết quả, ghi chú hoặc đổi trạng thái trước khi lưu.');
  if(p.ketQua==='Hẹn gọi lại' && !p.henGoiLai) return say('Chọn giờ hẹn gọi lại.');
  if(['Chuyển sale','Xin ý kiến cố vấn','Cố vấn trả lời'].includes(p.ketQua) && !p.ghiChu) return say('Ghi rõ nội dung khi chọn "'+p.ketQua+'".');
  if(CUR.viec && f.viec.some(v=>v.loai===CUR.viec)) p.viec=CUR.viec;
  if(CAP()==='ctv'){ p.trangThai=''; p.khoa=''; }
  if(['Dừng','Nuôi dưỡng'].includes(p.trangThai) && !p.lyDo) return say('Chọn lý do khi chuyển sang '+p.trangThai+'.');
  const b=g('#sv'); b.disabled=true; b.textContent='Đang lưu…';
  try{ D=await api('ghiLienHe',{p}); toast('Đã lưu'); CUR={viec:'',kq:''}; closeFam(); render(); }
  catch(e){ b.disabled=false; b.textContent='Lưu'; if(!e.silent) say(e.message); }
}

  $('#main').innerHTML=`<div class="bar"><p class="hint" style="margin:0;flex:1;min-width:220px">Hành trình 21 ngày, ba điểm chốt hằng tuần, việc theo vai trò CTV · Sale · Cố vấn, cách tìm JTBD, khung offer và kịch bản gọi.</p>
    <a class="act" href="ban-do.html" target="_blank" rel="noopener">↗ Mở toàn trang</a></div>
    <iframe class="bd-frame" src="ban-do.html" title="Bản đồ điểm chạm và chốt offer" loading="lazy"></iframe>`;
}
/* ---------- Sổ tay chăm sóc phụ huynh (dữ liệu: so-tay.json, cập nhật 18:00 mỗi ngày) ---------- */
let ST=null, ST_ERR='', ST_Q='', ST_B='', ST_OPEN='';
async function taiSoTay(){
  try{ const r=await fetch('so-tay.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error(r.status); ST=await r.json(); ST_ERR=''; }
  catch(e){ ST_ERR='Chưa tải được sổ tay. Bấm Tải lại hoặc thử lại sau.'; }
}
function stBlock(id){ return (ST.blocks||[]).find(b=>b.id===id); }
function stMoi(id){ const lim=Date.now()-3*864e5;
  return (ST.nhatKy||[]).some(n=>(n.blocks||[]).includes(id) && Date.parse(n.ngay+'T23:59:59+07:00')>=lim); }
function stNode(id, cls){ const b=stBlock(id); if(!b) return '';
  return `<button type="button" class="st-node ${cls||''}" data-stgo="${esc(b.id)}" aria-label="Mở block ${esc(b.ten)}">
    <span class="no">${b.so?'Block '+b.so:'Nền tảng'} ${b.icon||''}</span><b>${esc(b.ten)}</b><small>${esc(b.tom||'')}</small>
    ${(b.trangThai||[]).length?`<span class="st-pills">${b.trangThai.map(t=>`<span class="st-pill">${esc(t)}</span>`).join('')}</span>`:''}</button>`; }
function stList(arr, tag){ return arr&&arr.length?`<${tag}>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</${tag}>`:''; }
function stCard(b){
  const nFaq=(ST.faq||[]).filter(f=>f.b===b.id).length;
  const tpl=(b.tinMau||[]).map(k=>((D&&D.tinMau&&D.tinMau[k])||{}).ten||k);
  const open=ST_OPEN===b.id;
  return `<article class="st-card" id="st-${esc(b.id)}">
    <div class="st-ch"><span class="st-ic" aria-hidden="true">${b.icon||'•'}</span><div>
      <span class="no">${b.so?'Block '+b.so:'Nền tảng'} · ${b.loai==='noi-bo'?'Nội bộ':b.loai==='nen'?'Áp dụng mọi block':'Phụ huynh thấy'}</span>
      <h4>${esc(b.ten)}${stMoi(b.id)?'<span class="st-new">Mới cập nhật</span>':''}</h4><p>${esc(b.tom||'')}</p></div></div>
    <details data-stcard="${esc(b.id)}" ${open?'open':''}><summary>Xem chi tiết</summary><div class="st-body">
      <div class="full"><h5>Mục tiêu</h5><p>${esc(b.mucTieu||'')}</p></div>
      <div><h5>Ai phụ trách</h5><p>${esc(b.phuTrach||'')}</p></div>
      <div><h5>Cam kết thời gian</h5><p>${esc(b.camKet||'')}</p></div>
      ${b.lam&&b.lam.length?`<div class="full"><h5>Việc cần làm</h5>${stList(b.lam,'ol')}</div>`:''}
      ${b.luuY&&b.luuY.length?`<div class="full"><h5>Lưu ý</h5>${stList(b.luuY,'ul')}</div>`:''}
      ${b.chuyenCap?`<div><h5>Chuyển cấp</h5><p>${esc(b.chuyenCap)}</p></div>`:''}
      ${(b.trangThai||[]).length?`<div><h5>Trạng thái gia đình</h5><p>${b.trangThai.map(esc).join(' · ')}</p></div>`:''}
      ${tpl.length?`<div class="full"><h5>Tin mẫu Zalo dùng ở block này</h5><div class="st-tpl">${tpl.map(t=>`<span>📋 ${esc(t)}</span>`).join('')}</div><p class="hint">Mở hồ sơ gia đình, bấm 📋 Tin mẫu để có tin đã điền sẵn tên con.</p></div>`:''}
      ${(b.lienKet||[]).length?`<div class="full"><h5>Liên kết</h5><ul>${b.lienKet.map(l=>`<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.ten)}</a></li>`).join('')}</ul></div>`:''}
      ${nFaq?`<div class="full"><button class="act" type="button" data-stfaq="${esc(b.id)}">❓ ${nFaq} câu hỏi thường gặp của block này</button></div>`:''}
    </div></details></article>`;
}
function stNorm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d'); }
function stFaqHtml(){
  const ws=stNorm(ST_Q).split(/\s+/).filter(Boolean);
  const list=(ST.faq||[]).filter(f=>{ if(ST_B&&f.b!==ST_B) return false; const t=stNorm(f.h+' '+f.d+' '+((stBlock(f.b)||{}).ten||'')); return ws.every(w=>t.includes(w)); });
  if(!list.length) return `<div class="empty"><b>Chưa có câu hỏi phù hợp</b>Thử từ khóa khác, hoặc ghi câu hỏi mới vào phần Ghi chú của hồ sơ để bổ sung sổ tay.</div>`;
  return list.map(f=>{ const b=stBlock(f.b)||{}; const i=(ST.faq||[]).indexOf(f);
    return `<details class="st-q"><summary><b>${esc(f.h)}</b>${f.duyet?'<span class="st-duyet">Cần Quản lý duyệt</span>':''}<span class="st-tag">${esc(b.ten||'')}</span></summary>
      <div class="st-a"><p>${esc(f.d)}</p><button class="act" type="button" data-stcp="${i}">📄 Chép câu trả lời</button></div></details>`; }).join('');
}
function stBindFaq(){
  document.querySelectorAll('[data-stcp]').forEach(b=>b.onclick=()=>copyText(ST.faq[+b.dataset.stcp].d,'Đã chép câu trả lời. Nhớ thay tên con trước khi gửi.'));
}
function stRefreshFaq(){
  $('#stFaqList').innerHTML=stFaqHtml(); stBindFaq();
  document.querySelectorAll('[data-stb]').forEach(c=>c.classList.toggle('on',c.dataset.stb===ST_B));
}
async function rSt(){
  const m=$('#main');
  if(!ST && !ST_ERR){ m.innerHTML='<div class="loading">Đang tải sổ tay…</div>'; await taiSoTay(); if(TAB!=='st') return; }
  if(!ST){ m.innerHTML=`<div class="fatal"><b>Sổ tay</b>${esc(ST_ERR)}</div>`; ST_ERR=''; return; }
  const sd=ST.soDo||{}, cap=ST.capNhat?new Date(ST.capNhat):null;
  const counts={}; (ST.faq||[]).forEach(f=>counts[f.b]=(counts[f.b]||0)+1);
  const nhatKy=(ST.nhatKy||[]).slice().sort((a,b)=>String(b.ngay).localeCompare(String(a.ngay)));
  m.innerHTML=`<section class="st-hd"><h2>Sổ tay chăm sóc phụ huynh</h2>
    <p class="st-meta">Cập nhật ${cap?esc(cap.toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit',year:'numeric'})):'—'} · Tự rà soát lúc 18:00 mỗi ngày khi dự án có thay đổi${ST.nguonDayDu?` · <a href="${esc(ST.nguonDayDu)}" target="_blank" rel="noopener">Bản đầy đủ</a>`:''}</p>
    <div class="st-jump"><a class="chip" href="#stMap">Sơ đồ tổng quan</a><a class="chip" href="#stBlocks">Các block</a><a class="chip" href="#stFaq">Câu hỏi thường gặp <span class="c">${(ST.faq||[]).length}</span></a><a class="chip" href="#stLog">Nhật ký thay đổi</a></div></section>

  <section class="st-sec" id="stMap"><h3>Sơ đồ tổng quan</h3><p class="hint">Bấm vào một ô để mở block tương ứng. Nhãn xanh là trạng thái gia đình trên trang quản trị.</p>
    <div class="st-map">
      <p class="st-lbl">Hành trình của phụ huynh</p>
      <ol class="st-flow">${(sd.hanhTrinh||[]).map(id=>`<li>${stNode(id)}</li>`).join('')}</ol>
      ${sd.vong?`<div class="st-loop">↺ <b>${esc(sd.vong)}</b></div>`:''}
      <p class="st-lbl">Đội hỗ trợ vận hành phía sau</p>
      <div class="st-inner">${(sd.noiBo||[]).map(id=>stNode(id)).join('')}</div>
      ${sd.nen?`<div class="st-base">${stNode(sd.nen)}</div>`:''}
    </div></section>

  <section class="st-sec" id="stBlocks"><h3>Các block</h3><p class="hint">Mỗi block là một điểm chạm hoặc một mảng việc: mục tiêu, người phụ trách, cam kết thời gian, việc cần làm, lưu ý, tin mẫu.</p>
    <div class="st-grid">${(ST.blocks||[]).slice().sort((a,b)=>a.so-b.so).map(stCard).join('')}</div></section>

  <section class="st-sec" id="stFaq"><h3>Câu hỏi phụ huynh hay gặp</h3><p class="hint">Câu trả lời viết sẵn để chép gửi Zalo. Câu có nhãn vàng cần hỏi Quản lý trước khi trả lời chắc chắn.</p>
    <div class="st-search"><input id="stQ" type="search" placeholder="Tìm: hoàn phí, micro, Zoom, xếp hạng…" aria-label="Tìm câu hỏi" value="${esc(ST_Q)}"></div>
    <div class="bar st-chips" style="margin-top:0"><button class="chip ${!ST_B?'on':''}" type="button" data-stb="">Tất cả<span class="c">${(ST.faq||[]).length}</span></button>
      ${(ST.blocks||[]).filter(b=>counts[b.id]).map(b=>`<button class="chip ${ST_B===b.id?'on':''}" type="button" data-stb="${esc(b.id)}">${esc(b.ten)}<span class="c">${counts[b.id]}</span></button>`).join('')}</div>
    <div class="st-faq" id="stFaqList"></div></section>

  <section class="st-sec" id="stLog"><h3>Nhật ký thay đổi</h3><p class="hint">Mỗi ngày lúc 18:00, sổ tay được rà lại theo thay đổi trong ngày của hệ thống và các điểm chạm với phụ huynh. Ngày không có thay đổi thì không ghi.</p>
    <ul class="st-log">${nhatKy.map(n=>`<li><time>${esc(n.ngay.split('-').reverse().join('/'))}</time><span class="k">${esc(n.loai||'')}</span>${esc(n.noiDung)}${(n.blocks||[]).length?` <span class="st-tag">· ${n.blocks.map(id=>esc((stBlock(id)||{}).ten||id)).join(', ')}</span>`:''}</li>`).join('')}</ul></section>`;
  stRefreshFaq();
  m.querySelectorAll('[data-stgo]').forEach(b=>b.onclick=()=>stGo(b.dataset.stgo));
  m.querySelectorAll('[data-stcard]').forEach(d=>d.ontoggle=()=>{ if(d.open) ST_OPEN=d.dataset.stcard; else if(ST_OPEN===d.dataset.stcard) ST_OPEN=''; });
  m.querySelectorAll('[data-stfaq]').forEach(b=>b.onclick=()=>{ ST_B=b.dataset.stfaq; ST_Q=''; $('#stQ').value=''; stRefreshFaq(); $('#stFaq').scrollIntoView({behavior:'smooth'}); });
  m.querySelectorAll('[data-stb]').forEach(c=>c.onclick=()=>{ ST_B=c.dataset.stb; stRefreshFaq(); });
  m.querySelectorAll('.st-jump a').forEach(a=>a.onclick=e=>{ e.preventDefault(); const t=document.querySelector(a.getAttribute('href')); if(t) t.scrollIntoView({behavior:'smooth'}); });
  $('#stQ').oninput=e=>{ ST_Q=e.target.value; stRefreshFaq(); };
}
function stGo(id){
  const c=document.getElementById('st-'+id); if(!c) return;
  const d=c.querySelector('details'); if(d) d.open=true; ST_OPEN=id;
  c.scrollIntoView({behavior:'smooth',block:'start'}); c.classList.add('flash'); setTimeout(()=>c.classList.remove('flash'),1600);
}

/* ---------- khung ---------- */
$('#tabs').onclick=e=>{ const b=e.target.closest('button'); if(!b||!D) return; TAB=b.dataset.t; render(); window.scrollTo({top:0}); };
$('#reload').onclick=()=>{ TK=null; if(TAB==='st'){ ST=null; } load(); };
$('#meBtn').onclick=e=>{ e.stopPropagation(); const p=$('#mePop'); p.hidden=!p.hidden; $('#meBtn').setAttribute('aria-expanded',String(!p.hidden)); };
document.addEventListener('click',e=>{ if(!e.target.closest('.menu')) $('#mePop').hidden=true; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ $('#mePop').hidden=true; if(OPEN) closeFam(); else if($('#sheetHost').innerHTML && !$('#fMk')) $('#sheetHost').innerHTML=''; } });
$('#mDoiMk').onclick=()=>{ $('#mePop').hidden=true; showDoiMk(false); };
$('#mThoat').onclick=async()=>{ $('#mePop').hidden=true; try{ await api('dangXuat'); }catch(e){} store.clear(); D=null; TK=null; showLogin(); };
setInterval(()=>{ if(D && !OPEN && !$('#sheetHost').innerHTML && document.visibilityState==='visible' && TAB!=='tk' && TAB!=='st') load(); }, 120000);
setInterval(()=>{ if(D && !OPEN && !$('#sheetHost').innerHTML && TAB==='viec') rViec(); }, 30000);
batDau();
</script>
</body>
</html>
