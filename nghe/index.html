<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Listen · 听一听 · Anh – Trung – Kids Workbook</title>
<style>
:root{--ink:#2F463C;--red:#C8372D;--teal:#2E8B80;--gold:#F2C14E;--cream:#FFF8E6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--cream);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;padding:16px}
main{width:100%;max-width:440px;background:#fff;border:3px solid var(--gold);border-radius:28px;padding:24px 20px;text-align:center}
h1{margin:0;font-size:22px;color:var(--red)}h2{margin:4px 0 18px;font-size:15px;font-weight:600;color:#6b6b6b}
#play{width:150px;height:150px;border-radius:50%;border:0;background:var(--teal);color:#fff;font-size:64px;cursor:pointer;box-shadow:0 6px 0 #1f655d}
#play:active{transform:translateY(4px);box-shadow:0 2px 0 #1f655d}
audio{width:100%;margin-top:22px}.hint{font-size:14px;color:#6b6b6b;margin-top:14px;line-height:1.5}.zh{font-family:'Noto Sans SC',sans-serif}
</style></head><body><main>
<h1 id="t">Workbook · Listen</h1><h2 class="zh">练习册 · 听一听</h2>
<button id="play" aria-label="Play">▶</button>
<audio id="a" controls preload="none"></audio>
<p class="hint">Press ▶ and do the page. The voice will tell you what to do.<br>点一下 ▶，跟着声音做练习。<br><span id="err" style="color:#C8372D"></span></p>
</main>
<script>
const id=(new URLSearchParams(location.search).get('t')||'').replace(/[^a-z0-9-]/g,'');
const m=id.match(/^(sd|ls)-s(\d+)(?:-(en|zh))?$/),a=document.getElementById('a'),b=document.getElementById('play');
if(!m){document.getElementById('err').textContent='Scan the QR code on your workbook page.'}else{
 const lvl=m[1]==='sd'?'Seedling':'Little Seed';
 document.getElementById('t').textContent=lvl+' · Session '+m[2]+(m[3]==='zh'?' · 中文':m[3]==='en'?' · English':'');
 a.src='audio/'+id+'.mp3';
 b.onclick=()=>{a.paused?a.play():a.pause()};a.onplay=()=>b.textContent='❚❚';a.onpause=()=>b.textContent='▶';a.onended=()=>b.textContent='▶';
 a.onerror=()=>{document.getElementById('err').textContent='Audio is not ready yet.'};
}
</script></body></html>
